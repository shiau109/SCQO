name = "qc-swap-flux-stark"
repos = { scqo = "9ad2487", scqat = "27d0893", "scqo-qm" = "4667438" }
kind = "additive"
coupling = "scqo needs scqat >= 27d0893: qc_swap_flux_stark's estimate() lazy-imports the NEW package scqat.estimators.qc_swap_flux_stark. The catalog still imports fine under an older scqat and every other experiment is unaffected, but `scqo run qc_swap_flux_stark` then dies with ImportError at estimate - i.e. LOUDLY, but only after the run has already cost instrument minutes. Same shape as the qc_n_stark_amp / qubit_stark_phase_echo floors."
validated = "offline"
notes = "NEW EXPERIMENT qc_swap_flux_stark (QM only, record-only): the fixed-N flux x AC-Stark swap map. qc_n_swap_amp sweeps (control flux x N) and qc_n_stark_amp sweeps (stark amplitude x N), each at a fixed value of the other knob - but the two are coupled, because the detuning winds its own phase between rounds on top of the idle phase the Stark tone cancels. The transfer therefore peaks along a RIDGE in the (flux, stark) plane, and neither one-dimensional scan walks to its bright point. This experiment freezes the swap count to a scalar and sweeps both amplitudes instead, reporting best_flux_amp_v / best_stark_amp / best_transfer in result.fit with the usual min_transfer verdict; nothing is written back to the device. TWO TRAPS, both spelled out in the field descriptions because both are silent: (1) swap_count = 1 leaves the stark axis INERT - the single tone plays after the only swap, where it can do nothing but imprint a phase - so the field floors at 1 and defaults to 4; (2) at a fixed N the peak is a WORKING POINT, not a decomposition into exchange angle and phase, and near a full per-round swap it trades a nonzero phase for a better angle (the same trap that makes qc_n_stark_amp's best_stark_amp unusable there), so pick N with N swaps about one full transfer. OPERATOR PREREQUISITE: the pair's control qubit needs the named off-resonant 'stark' xy operation (quam_config/register_stark.py in scqo-qm); the probe refuses BY NAME if it is missing, and that registration is still owed on 5Q4C. HARDWARE VALIDATION OWED - offline only so far (scqat 762 / scqo-qm 647 / SCQO targeted), and on 5Q4C the known decouple_offset problem in BACKLOG.md affects any angle read off this map. Docs: TUTORIAL section 12 gains step 3b."
