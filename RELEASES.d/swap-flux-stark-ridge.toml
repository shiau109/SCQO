name = "swap-flux-stark-ridge"
repos = { scqat = "ab83ded", scqo = "563c95c" }
kind = "additive"
coupling = "scqo needs scqat >= ab83ded: SILENT IN BOTH HALVES. `estimate()` forwards four new kwargs (swap_count / swap_angle_rad / stark_amp_2pi / min_row_contrast) to an estimator that takes bare `**kwargs` on both hooks and opts into no allowlist, so an older scqat SWALLOWS them; and every RIDGE_KEY is lifted through `.get(key, nan)` while the outcome comes from the independent transfer verdict. A scqat with no ridge at all therefore imports fine, runs fine, reports SUCCESSFUL, draws ONE figure instead of two and leaves every compensation number NaN. A scqat that has the ridge but predates the arch fit (b80b04d..9f09b8d) is worse: it reports the OLD largest-row resonance as if nothing changed, with every error and all three refusal flags NaN. Unlike the v3.11.0 COMPENSATION_KEYS pairing this one HAS a test behind it — tests/test_model_experiments.py::test_qc_swap_flux_stark_lifts_the_ridge_read_into_the_fit asserts the flags are 0, so either mismatch fails the offline suite."
validated = "offline 2026-09-21 — scqat: the estimator's own 31, swap_lineshape 31, the tool's other consumers qc_n_stark_amp 15 and pair_swap_flux_map 14, plus test_figures and test_docs_current: 98 in scqat/.venv; SCQO: test_model_experiments.py -k qc_swap_flux_stark (7) plus test_capabilities and test_docs_current (35) in SCQO/.venv; scqo-qm untouched, its qc_swap_flux_stark probe tests re-run green (11) in .venv-qm. All zero-skip. PLUS re-analysis of SIX real 5Q4C q1_q2 runs — 20260920-192637-643 / -192811-920 / -192940-370 (N = 1/2/3, coupler 0.11), 20260920-212001-377 (N = 5, coupler 0.085) and 20260921-091847-944 / -105115-861 / -123240-776 (N = 4/5/5) — which is where the design and every one of its corrections came from. No run has yet been TAKEN with the priors in hand."
notes = '''BEHAVIOR CHANGE: `qc_swap_flux_stark` stops being draw-only. `result.fit` gains twenty-four RIDGE_KEYS, the estimator writes a second figure `qc_swap_flux_stark_ridge.png`, and its plot_data gains `transfer`, six per-flux-row columns and the fitted arch (`arch_fit` on a dense axis `flux_amp_v_dense`). Nothing existing changes value or name, and the SUCCESS verdict is still `min_transfer` alone.

WHY. The only numbers the experiment published were the map's 2-D argmax, and neither axis of it is the calibration. `T(N) = sin^2(theta) * [sin(N*theta_eff)/sin(theta_eff)]^2` with `cos(theta_eff) = cos(phi/2)*cos(theta)`, so at fixed N the transfer peaks where `N*theta_eff = pi/2` — the N=2 map's `best_flux_amp_v` sat 3.25 mV from resonance against a 5.75 mV FWHM — while at N=1 the single tone plays after the only swap and can imprint nothing but a phase, so `best_stark_amp` was a draw between 21 statistically identical cells. The N=5 map repeated it at 200 averages: its top seven cells spanned 0.690 to 0.655 against a 0.035 shot-noise sigma. Those keys REMAIN, as the map summary they always were; operators must stop reading them as a working point.

WHAT REPLACES THEM. Along any fixed flux row the largest transfer is at `phi = 0` exactly, as long as `theta <= pi/N` (`U_{N-1}` is monotone on `[cos(pi/N), 1]`), so the per-row optimum IS a compensation measurement and the row's own peak VALUE is the transfer on the ridge, with no model in between. Rows count only when their observed swing clears `min_row_contrast` (model-free, the `trace_contrast` lesson).

THE RESONANCE IS FITTED, NOT PICKED. Read along the flux, those row peaks trace an ARCH, and its top is flat. The exact shape follows from the single-pulse kernel `swap_lineshape` already documents: with the phase compensated the round's rotation axis is equatorial, so its off-diagonal `sqrt(P_1)` composes as `sin(N*alpha)`, giving `T_N = sin^2(N*arcsin(sin(theta*s)/s))`, `s = sqrt(1 + (beta*(V - V0))^2)` — three parameters, no amplitude or offset (the normalized transfer pins both), and `N = 1` is the documented kernel exactly. On `20260921-123240-776` a 150-draw shot-noise bootstrap put the largest row at +-0.79 mV, a 2-D bicubic or smoothing-spline read of the map at +-0.76 / +-0.72 (they still pick a point on the top), a local 2-D paraboloid failed 149 of 150 draws, and the arch fit at +-0.10 mV; the largest row sat 1.3 mV from the centre, and read there the compensation is 0.662 against 0.804 at the centre — nearly three stark steps. The fit's reduced chi-square against pure shot noise was 0.8-1.2 on all four N=4/5 runs, so the error it reports (taken from the residual; no shot count needed) is one to act on. A flux-curvature term was tried and is not in the model: 1.9 sigma, chi-square down by 3.2. The largest row stays reported (`ridge_peak_flux_amp_v`), because it needs no prior.

THREE REFUSALS, each NaN-ing its numbers while the errors stay to show why. `resonance_at_edge`: the fitted centre lies outside the live rows less half a step — `20260921-105115-861`, a 3 mV window, fitted -151.01 +- 1.98 mV against a window starting at -151.00, where the old read had reported -150.85 without a word. `resonance_unresolved`: the centre's error exceeds a tenth of the live span, or moves the compensation by more than one stark step (`compensating_stark_err` = local ridge slope x centre error), or the fit failed or was never possible with the gate open (fewer than five live rows) — the resolved runs sit at <= 0.014 of their span and the 3 mV window at 0.66. `compensation_in_gap` (was `resonance_in_gap`, never released): a folded arch buries its centre in a dead band, and the fit now REACHES it from the two flanks — the N=2 map `20260920-192811-920` reads -149.164 +- 0.024 mV across a seven-row band, within 0.1 mV of three independent reads (its N=2 null, the N=1 and N=3 peaks) — but the compensation there would be interpolated across the band, so only that number is withheld (bracketing live rows more than two flux steps apart). `compensating_is_refined` is gone: a fitted centre is always sub-grid.

THE COMPENSATION IS READ LOCALLY. The per-round phase is linear in the FLUX, so `phi = 0` is a straight line in PHASE — but the stark tone's phase is not proportional to its amplitude. `qubit_stark_phase_echo` on the same chip (20260920-192451-797) measured `dphi/da` = 3.3 rad at a = 0.2 against 8.9 at 0.6, and 2*pi at a = 0.993 where the fitted `a^2` coefficient puts it at 1.100. A line across the whole axis cost a factor of ~3 in residual (0.042 against 0.016 stark units) and moved the implied compensation by more than a grid step. The compensating amplitude is therefore interpolated between the two live rows that BRACKET the fitted centre and nowhere else; the wider window survives only as `ridge_slope_per_v` (how tightly the flux must be held) and `ridge_local_rms` (whether the stark axis resolved the ridge at all). No phase curve has to be carried between runs.

THE RIDGE IS PERIODIC. `phi = 0` means `phi = 0 mod 2*pi`, so the optimum re-enters the swept window from the far end whenever the flux drives the phase past a turn — on the N=5 map it fell to 0.08 at -150.5 mV and came back at 0.95 one row later. The jumps are undone before anything is interpolated, with the raw jump corrected for the local slope it also contains (13% of the period).

TWO GATES. `swap_angle_rad` — the exchange angle of ONE swap at the coupler flux the chosen `swap_operation` bakes, read from a preceding `pair_swap_flux_map`'s per-column `theta_rad` — is a BRANCH SELECTOR, not a fitted value; good to `pi/(2N)` is enough. It decides `ridge_ok` (`N*theta <= pi`: the per-row argmax is still `phi = 0`) and `branch_ok` (`N*theta <= pi/2`: the arch has not folded), deliberately not collapsed into one — 5Q4C's N=2 map sits between them. The gates pick the band the arch fit's angle may live in, `(0, pi/(2N)]` or `[pi/(2N), pi/N]`: the two give the same height on resonance, so the band is not something a noisy trace should decide, but they differ in SHAPE, and a wrong band fails the fit outright (the N=2 map's unfolded band scored chi2/dof 18.6 against 0.65). The fitted angle is reported as `swap_angle_rad_refined` under `branch_ok` only.

OPERATOR NOTES, all earned on hardware. (1) Do NOT pass `theta_max_rad` as the prior: it is that map's largest QUOTABLE column, not the column your macro plays — on `20260920-195847-688` it was 1.216 (coupler 0.106) while the baked 0.11 column read pi/2 with `branch_warn` set, and a branch-warned column is not a usable prior at all. (2) Pick N from the prior as `N ~ pi/(4*theta)`: that lands on the steepest part of `sin^2(N*theta)` and opens both gates with margin, while `N*theta` near `pi/2` is the saturated peak where the angle has no sensitivity. (3) Set `max_stark_amp` to the echo's `amp_2pi_factor` and pass it as `stark_amp_2pi`: a SHORTER window leaves some rows with no compensation point at all and pins their peak against the edge, inventing ridge points; a longer one adds a partial second branch. The map's own measured wrap is reported (`ridge_wrap_amp`) and cross-checked against it (`wrap_consistent`) — 0.973 against 0.993 on the N=5 run. (4) Size the flux window to the ARCH, not the stripe: the fit needs both flanks. The 7-10 mV windows of the N=4/5 runs resolved the centre to +-0.06-0.10 mV; the 3 mV one did not, and is refused.

WHAT IT READS ON REAL DATA (q1_q2, `stark_amp_2pi` = 1.0 unless noted). `20260920-212001-377` (N=5, 10 mV, prior 0.250, `stark_amp_2pi` 0.9931): resonance -149.85 +- 0.06 mV, compensating stark 0.262 +- 0.015, refined theta 0.2253 +- 0.0030. `20260921-123240-776` (N=5, 7 mV, prior 0.23): -149.48 +- 0.10 mV, 0.804 +- 0.011, theta 0.2062 +- 0.0029 — its largest row was -150.79. `20260921-091847-944` (N=4, 8 mV, prior 0.23): -149.10 +- 0.08 mV, 0.241 +- 0.018, theta 0.2247 +- 0.0030. `20260921-105115-861`: refused, at edge and unresolved. `20260920-192811-920` (N=2, prior 1.46): -149.164 +- 0.024 mV, compensation withheld. N=1 (`192637-643`) has zero rows above contrast — inert by construction — and N=3 (`192940-370`) is past `ridge_ok`. NOTE the three resolved N=4/5 runs disagree by up to 0.75 mV, far outside their errors. Not the gap: the two furthest apart (212001 and 091847) share a 20 ns gap and differ only in when they were taken (21:20 against 09:18 the next morning), while the 260 ns run sits between them — consistent with the flux point drifting overnight, untested. The largest row could not have seen this; the fit can.

ALSO IN THIS FRAGMENT. `swap_lineshape` gains `compensated_swap_arch` and `fit_compensated_swap_arch` (seeded from a coarse grid, polished with `least_squares`, errors from the residual with an explicit rank check — `curve_fit`'s pseudo-inverse reports a parameter the data do not constrain as error 0), and `parabolic_vertex` moved there from `qc_n_stark_amp`'s private helper; `fit_swap_peak` and `qc_n_stark_amp` are otherwise unchanged. SCQO's `simulate()` changed in three ways so the offline model exercises the reading instead of its blind spot: the resonant compensated round is a QUARTER swap rather than a half (at `N*theta = pi/2` the angle read is undefined — the same correction `qc_n_stark_amp` took when its contract was locked), the composite uses the exact Chebyshev ratio instead of an un-normalised `1 - tilt^2` (which moved the per-row optimum off `phi = 0`), and the detuning slope is sized from the swept WINDOW rather than the grid step. Any offline comparison of this experiment against a pre-release run is therefore superseded.

STILL OWED: a hardware run TAKEN with the priors in hand rather than re-analysed afterwards, one whose stark window is calibrated to a single period, and a repeat of one flux window across a few hours to confirm or rule out the drift above. The model the estimator does not carry — phase versus amplitude — is the standing limitation: a resonance inside a dead band is now FOUND, but its compensation is still withheld, and lifting that would mean passing the echo's measured curve, not a coefficient. KNOWN: `swap_angle_consistent` cannot fail under `branch_ok` — the fitted angle and the prior are both confined to `(0, pi/(2N)]` and the tolerance is that band's whole width; it predates the fit, and giving it a real tolerance is a policy call left open.'''
