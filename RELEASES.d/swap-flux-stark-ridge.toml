coupling = "scqo needs scqat >= 85ce138: SILENT IN BOTH HALVES. `estimate()` forwards three new kwargs (swap_count / swap_angle_rad / min_row_contrast) to an estimator that takes bare `**kwargs` on both hooks and opts into no allowlist, so an older scqat SWALLOWS them; and the fourteen RIDGE_KEYS are lifted through `.get(key, nan)` while the outcome comes from the independent transfer verdict. An older scqat therefore imports fine, runs fine, reports SUCCESSFUL, draws ONE figure instead of two and leaves every compensation number NaN. Unlike the v3.11.0 COMPENSATION_KEYS pairing this one HAS a test behind it — tests/test_model_experiments.py::test_qc_swap_flux_stark_lifts_the_ridge_read_into_the_fit — so the offline suite catches the mismatch."
validated = "offline 2026-09-20 — scqat targeted (the estimator's own 19, swap_lineshape 21, and the 49 swap-family consumers of the moved tool) in scqat/.venv; SCQO test_model_experiments.py -k 'qc_swap_flux_stark or pair_swap or qc_n_' 31 plus test_docs_current + test_capabilities 35 in SCQO/.venv; scqo-qm untouched, its probe + preview tests re-run green (17) in .venv-qm. All zero-skip. PLUS a re-analysis of three REAL saved 5Q4C q1_q2 runs (20260920-192637-643 / -192811-920 / -192940-370, N = 1/2/3), which is what the design was derived from — but no new hardware run."
notes = '''BEHAVIOR CHANGE: `qc_swap_flux_stark` stops being draw-only. `result.fit` gains fourteen RIDGE_KEYS, the estimator writes a second figure `qc_swap_flux_stark_ridge.png`, and its plot_data gains `transfer` plus six per-flux-row columns. Nothing existing changes value or name, and the SUCCESS verdict is still `min_transfer` alone.

WHY. The only numbers the experiment published were the map's 2-D argmax, and a 5Q4C q1_q2 N = 1/2/3 triple showed neither axis of it is the calibration. `T(N) = sin^2(theta) * [sin(N*theta_eff)/sin(theta_eff)]^2` with `cos(theta_eff) = cos(phi/2)*cos(theta)`, so at fixed N the transfer peaks where `N*theta_eff = pi/2` — the N=2 map's `best_flux_amp_v` sat 3.25 mV from resonance against a 5.75 mV FWHM — while at N=1 the single tone plays after the only swap and can imprint nothing but a phase, so `best_stark_amp` was a draw between 21 statistically identical cells (measured spread along stark 0.03-0.055 against a 0.05 shot-noise floor). Those keys REMAIN, as the map summary they always were; operators must stop reading them as a working point.

WHAT REPLACES THEM. Along any fixed flux row the largest transfer is at `phi = 0` exactly, as long as `theta <= pi/N` (`U_{N-1}` is monotone on `[cos(pi/N), 1]`), so the per-row optima trace the compensation ridge and a line through them gives the compensating amplitude at ANY flux — including one whose own row carried no signal, which is how the near-full-swap dead band at resonance is crossed. Rows enter the fit only when their observed swing clears `min_row_contrast` (model-free, the `trace_contrast` lesson).

THE PRIOR, AND THE TWO GATES. `swap_angle_rad` is the exchange angle of ONE swap at the coupler flux the chosen `swap_operation` bakes, read from a preceding `pair_swap_flux_map`'s per-column `theta_rad`. It is a BRANCH SELECTOR, not a fitted value — good to `pi/(2N)` is enough, and a 30%-off prior returns the identical refined angle. It decides two DIFFERENT gates, deliberately not collapsed into one: `ridge_ok` (`N*theta <= pi`) admits the ridge, the resonance and `compensating_stark_amp`; `branch_ok` (`N*theta <= pi/2`) admits `swap_angle_rad_refined`. 5Q4C's N=2 map sits BETWEEN them, and one combined gate would have discarded a compensating amplitude the map does carry. The single fold `ridge_ok` allows is undone, with the latch level taken as a fraction of the ridge transfer's own maximum — a fixed 0.95 misses it (that map peaked at 0.936) and the resonance then reads as a local minimum.

OPERATOR NOTES. Two traps worth carrying into the release notes. (1) Do NOT pass `theta_max_rad` as the prior: it is that map's largest QUOTABLE column, not the column your macro plays — on `20260920-195847-688` it was 1.216 (coupler 0.106) while the baked 0.11 column read pi/2 with `branch_warn` set. A branch-warned column is not a usable prior at all. (2) Pick N from the prior as `N ~ pi/(4*theta)`: that lands on the steepest part of `sin^2(N*theta)` (`delta_theta ~ delta_T/N`, an N-fold gain over a single swap) and opens both gates with margin, while `N*theta` near `pi/2` is the WORST choice — the saturated peak, where the angle has no sensitivity at all.

ALSO IN THIS FRAGMENT. `parabolic_vertex` moved from `qc_n_stark_amp`'s private helper into `scqat/tools/swap_lineshape.py` (two estimators now refine a swept optimum); `qc_n_stark_amp` imports it and is otherwise unchanged. SCQO's `simulate()` changed in three ways so the offline model exercises the reading instead of its blind spot: the resonant compensated round is a QUARTER swap rather than a half (at `N*theta = pi/2` the angle read is undefined — the same correction `qc_n_stark_amp` took when its contract was locked), the composite uses the exact Chebyshev ratio instead of an un-normalised `1 - tilt^2` (which moved the per-row optimum off `phi = 0`), and the detuning slope is sized from the swept WINDOW rather than the grid step. Any offline comparison of this experiment against a pre-release run is therefore superseded.

STILL OWED: a hardware run taken WITH a prior in hand — every number above comes from re-analysing three runs that were taken before the prior existed, so the branch_ok path (`N*theta <= pi/2`) has never been exercised on real data. On 5Q4C that means dropping the coupler from 0.11, where `partial_swap` is effectively a full iSWAP, to roughly 0.08-0.09.'''
