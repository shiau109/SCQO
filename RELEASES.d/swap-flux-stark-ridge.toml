kind = "additive"
coupling = "scqo needs scqat >= b80b04d: SILENT IN BOTH HALVES. `estimate()` forwards four new kwargs (swap_count / swap_angle_rad / stark_amp_2pi / min_row_contrast) to an estimator that takes bare `**kwargs` on both hooks and opts into no allowlist, so an older scqat SWALLOWS them; and the seventeen RIDGE_KEYS are lifted through `.get(key, nan)` while the outcome comes from the independent transfer verdict. An older scqat therefore imports fine, runs fine, reports SUCCESSFUL, draws ONE figure instead of two and leaves every compensation number NaN. Unlike the v3.11.0 COMPENSATION_KEYS pairing this one HAS a test behind it — tests/test_model_experiments.py::test_qc_swap_flux_stark_lifts_the_ridge_read_into_the_fit — so the offline suite catches the mismatch."
validated = "offline 2026-09-20 — scqat: the estimator's own 25, swap_lineshape 21, qc_n_stark_amp and the other swap-family consumers of the moved tool, in scqat/.venv; SCQO: test_model_experiments.py -k 'qc_swap_flux_stark or pair_swap or qc_n_' plus test_capabilities and test_docs_current, 32, in SCQO/.venv; scqo-qm untouched, its probe tests re-run green (11) in .venv-qm. All zero-skip. PLUS re-analysis of FOUR real 5Q4C q1_q2 runs — 20260920-192637-643 / -192811-920 / -192940-370 (N = 1/2/3, coupler 0.11) and 20260920-212001-377 (N = 5, coupler 0.085) — which is where both the design and its two corrections came from. No run has yet been TAKEN with the priors in hand."
notes = '''BEHAVIOR CHANGE: `qc_swap_flux_stark` stops being draw-only. `result.fit` gains seventeen RIDGE_KEYS, the estimator writes a second figure `qc_swap_flux_stark_ridge.png`, and its plot_data gains `transfer` plus six per-flux-row columns. Nothing existing changes value or name, and the SUCCESS verdict is still `min_transfer` alone.

WHY. The only numbers the experiment published were the map's 2-D argmax, and neither axis of it is the calibration. `T(N) = sin^2(theta) * [sin(N*theta_eff)/sin(theta_eff)]^2` with `cos(theta_eff) = cos(phi/2)*cos(theta)`, so at fixed N the transfer peaks where `N*theta_eff = pi/2` — the N=2 map's `best_flux_amp_v` sat 3.25 mV from resonance against a 5.75 mV FWHM — while at N=1 the single tone plays after the only swap and can imprint nothing but a phase, so `best_stark_amp` was a draw between 21 statistically identical cells. The N=5 map repeated it at 200 averages: its top seven cells spanned 0.690 to 0.655 against a 0.035 shot-noise sigma, and the winner was 0.05 where the ridge says 0.185. Those keys REMAIN, as the map summary they always were; operators must stop reading them as a working point.

WHAT REPLACES THEM. Along any fixed flux row the largest transfer is at `phi = 0` exactly, as long as `theta <= pi/N` (`U_{N-1}` is monotone on `[cos(pi/N), 1]`), so the per-row optimum IS a compensation measurement and the row's own peak VALUE is the transfer on the ridge, with no model in between. Rows count only when their observed swing clears `min_row_contrast` (model-free, the `trace_contrast` lesson).

THE READ IS LOCAL, AND THAT IS THE POINT. The per-round phase is linear in the FLUX, so `phi = 0` is a straight line in PHASE — but the stark tone's phase is not proportional to its amplitude. `qubit_stark_phase_echo` on the same chip (20260920-192451-797) measured `dphi/da` = 3.3 rad at a = 0.2 against 8.9 at 0.6, and 2*pi at a = 0.993 where the fitted `a^2` coefficient puts it at 1.100 — an 11% error, so not even a clean quadratic. A line across the whole axis cost a factor of ~3 in residual (0.042 against 0.016 stark units) and moved the implied compensation by more than a grid step. The compensating amplitude is therefore interpolated between the two live rows that BRACKET the resonance and nowhere else; the wider window survives only as `ridge_slope_per_v` (how tightly the flux must be held) and `ridge_local_rms` (whether the stark axis resolved the ridge at all). No phase curve has to be carried between runs.

THE RIDGE IS PERIODIC. `phi = 0` means `phi = 0 mod 2*pi`, so the optimum re-enters the swept window from the far end whenever the flux drives the phase past a turn — on the N=5 map it fell to 0.08 at -150.5 mV and came back at 0.95 one row later. The jumps are undone before anything is interpolated, with the raw jump corrected for the local slope it also contains (13% of the period).

TWO GATES, AND A THIRD REFUSAL. `swap_angle_rad` — the exchange angle of ONE swap at the coupler flux the chosen `swap_operation` bakes, read from a preceding `pair_swap_flux_map`'s per-column `theta_rad` — is a BRANCH SELECTOR, not a fitted value; good to `pi/(2N)` is enough, and a 30%-off prior returns the identical refined angle. It decides `ridge_ok` (`N*theta <= pi`: the per-row argmax is still `phi = 0` and the angle folds at most once) and `branch_ok` (`N*theta <= pi/2`: the principal `arcsin` does not fold), deliberately not collapsed into one — 5Q4C's N=2 map sits between them. The single fold `ridge_ok` allows is undone, with the latch level taken as a fraction of the ridge transfer's own maximum; a fixed 0.95 misses it (that map peaked at 0.936). The third way to get nothing is `resonance_in_gap`: when the resonance row carries no stark signal there is nothing local to interpolate, and the numbers are withheld rather than reached by a model.

OPERATOR NOTES, all three earned on hardware. (1) Do NOT pass `theta_max_rad` as the prior: it is that map's largest QUOTABLE column, not the column your macro plays — on `20260920-195847-688` it was 1.216 (coupler 0.106) while the baked 0.11 column read pi/2 with `branch_warn` set, and a branch-warned column is not a usable prior at all. (2) Pick N from the prior as `N ~ pi/(4*theta)`: that lands on the steepest part of `sin^2(N*theta)` and opens both gates with margin, while `N*theta` near `pi/2` is the saturated peak where the angle has no sensitivity. (3) Set `max_stark_amp` to the echo's `amp_2pi_factor` and pass it as `stark_amp_2pi`: a SHORTER window leaves some rows with no compensation point at all and pins their peak against the edge, inventing ridge points; a longer one adds a partial second branch. The map's own measured wrap is reported (`ridge_wrap_amp`) and cross-checked against it (`wrap_consistent`) — 0.973 against 0.993 on the N=5 run, two independent experiments agreeing to 2%.

WHAT IT READS ON REAL DATA. `20260920-212001-377` (N=5, coupler 0.085), prior theta = 0.250 and `stark_amp_2pi` = 0.9931: resonance -0.1501 V, compensating stark 0.185, refined theta 0.238 rad against the prior's 0.250 — 5% between two independent experiments — and `ridge_local_rms` 0.016 against a 0.05 stark step. The three earlier runs correctly report nothing: N=1 has zero rows above contrast (the stark axis is inert by construction), N=2 is `resonance_in_gap`, N=3 is past `ridge_ok`.

ALSO IN THIS FRAGMENT. `parabolic_vertex` moved from `qc_n_stark_amp`'s private helper into `scqat/tools/swap_lineshape.py` (two estimators now refine a swept optimum); `qc_n_stark_amp` imports it and is otherwise unchanged. SCQO's `simulate()` changed in three ways so the offline model exercises the reading instead of its blind spot: the resonant compensated round is a QUARTER swap rather than a half (at `N*theta = pi/2` the angle read is undefined — the same correction `qc_n_stark_amp` took when its contract was locked), the composite uses the exact Chebyshev ratio instead of an un-normalised `1 - tilt^2` (which moved the per-row optimum off `phi = 0`), and the detuning slope is sized from the swept WINDOW rather than the grid step. Any offline comparison of this experiment against a pre-release run is therefore superseded.

STILL OWED: a hardware run TAKEN with the priors in hand rather than re-analysed afterwards, and one whose stark window is calibrated to a single period. The model the estimator does not carry — phase versus amplitude — is the standing limitation: a resonance inside a dead band is refused today, and lifting that would mean passing the echo's measured curve, not a coefficient.'''
