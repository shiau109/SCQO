name = "pair-coupler-spectroscopy-zz"
repos = { scqat = "9611e82", scqo = "0415bfe", scqo-qm = "1a7a96c" }
kind = "additive"
coupling = "scqo needs scqat >= 9611e82: a LOUD floor, and late - pair_coupler_spectroscopy_zz's estimate() imports scqat.estimators.pair_coupler_spectroscopy_zz, absent before it, so the ImportError lands at ANALYSIS after the instrument time is spent; the dataset is saved and re-fits once scqat is current. scqo-qm needs scqo >= 0415bfe: the probe subclasses scqo.experiments.PairCouplerSpectroscopyZZ; the swap probe's shared code moved into scqo_qm/experiments/_coupler_tone.py in the same commit, so take scqo-qm whole. Builds on pair-coupler-spectroscopy-swap (the swap estimator's line finding and ladder moved into scqat tools/coupler_ladder.py, and its tone window into SCQO's _coupler_tone.CouplerToneParameters - unchanged behaviour, its tests and its reading of the 16 hardware runs identical) and on pair-coupler-crossing-pulse (the pair gate); take all three together, as a combo checkout does. scqo-qblox is untouched (QM-only)."
validated = "HARDWARE 5Q4C q1_q2 (cd2/qm_5q) 2026-09-27, run 20260927-211451-900 tagged coupler-scan: 6.85-7.35 GHz at 1 MHz, the tone on q2's line at -20 dBm, the calibrated x180 on q1 - no ZZ dip, as predicted (ZZ ~0.3-0.9 MHz against a 16 ns x180), outcome FAILED/no_line, pi_contrast 0.89 (the x180 on q1 survives the band-2 switch of its port), nothing proposed, q2_xy's drive_power_dbm restored to 0 dBm. Found: the no-pi reference arm shows q1's readout seeing the coupler (0.1 bumps at f01 7.057 and f02/2 6.991 GHz) while the pi arm does not, so pi-minus-reference makes false dips at the coupler's lines (1-2 points wide there, dropped) - to settle before the selective pi (BACKLOG F24). Suites in the environments ENVIRONMENTS.md names: scqat 958 passed (full, uv run --extra dev); scqo targeted - test_model_experiments -k 'coupler or runs_clean' 67 passed, test_capabilities + test_contract + test_one_estimator_per_experiment + test_docs_current + test_sweep_order 129 passed (uv run --extra viewer); scqo-qm 772 passed in .venv-qm (full), including the program and the moved-LO config BUILT on the live quam_state, and an offline --preview on the 5Q4C tree."
notes = '''NEW EXPERIMENT pair_coupler_spectroscopy_zz (additive, QM only, hardware-run on 5Q4C q1_q2): the coupler's 0-1 frequency at its idle point with the coupler never moving - experiment 2 of the three coupler tool experiments (BACKLOG F24, docs/coupler-readout-plan.md section 5). A tone on tone_on's drive line (default the low member: on 5Q4C q2, the more weakly coupled line for both couplers) excites the coupler when it hits a coupler transition; after the tone the OTHER member gets a pi, and while the coupler is excited the qubit-coupler ZZ detunes that member so a pi narrower than the ZZ misses and its population dips. Every frequency also runs a reference shot without the pi, back to back. Same absolute window as pair_coupler_spectroscopy_swap (at most 500 MHz, one LO at its centre, the MW-FEM band switched with the port-pair partner and the QUAM tree restored straight after the config is built).

THE PI is the member's calibrated x180 for now (user: try the gate first, reshape the pulse only if there is no signal); on 5Q4C it shows no dip, and the next step is a ~2 us square selective pi. THE ESTIMATOR (new, 1:1) takes the pi member's pi-minus-reference population, finds its dips (on the negated trace - fit_peaks' own dip path mis-seeds its fits, a separate fix is suggested), reads f01 as the highest with every other dip on its multi-photon ladder, and reports pi_contrast. WHAT IT WRITES (one SUCCESSFUL pair): the coupler mode's f_01_hz and, with an f02/2 dip, its anharmonicity_hz; no knob. ALSO: scqat gains tools/coupler_ladder.py (find_lines, lines_curve, read_ladder) shared with the swap estimator; SCQO gains experiments/_coupler_tone.py (CouplerToneParameters, tone_lo_hz); scqo-qm gains experiments/_coupler_tone.py (the moved-LO config, the band choice, the threshold gate, the config-bound acquire).'''
