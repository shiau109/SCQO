name = "pair-coupler-spectroscopy-zz"
repos = { scqat = "1bd0899", scqo = "dfa3efd", scqo-qm = "1bc2862" }
kind = "additive"
coupling = "scqo needs scqat >= 1bd0899: a LOUD floor, and late - pair_coupler_spectroscopy_zz's estimate() imports scqat.estimators.pair_coupler_spectroscopy_zz, absent before 9611e82, so the ImportError lands at ANALYSIS after the instrument time is spent; the dataset is saved and re-fits once scqat is current. Between 9611e82 and 1bd0899 the estimator read pi minus reference, which digs false dips where the pi member's readout sees the coupler - a SILENT difference. scqo-qm needs scqo >= dfa3efd: the probe reads selective_pi_len_ns, absent before it (AttributeError before any QUA is built), and subclasses scqo.experiments.PairCouplerSpectroscopyZZ; the swap probe's shared code moved into scqo_qm/experiments/_coupler_tone.py in 1a7a96c, so take scqo-qm whole. Builds on pair-coupler-spectroscopy-swap (the swap estimator's line finding and ladder moved into scqat tools/coupler_ladder.py, and its tone window into SCQO's _coupler_tone.CouplerToneParameters - unchanged behaviour, its tests and its reading of the 16 hardware runs identical) and on pair-coupler-crossing-pulse (the pair gate); take all three together, as a combo checkout does. scqo-qblox is untouched (QM-only)."
validated = "HARDWARE 5Q4C q1_q2 and q2_q3 (cd2/qm_5q) 2026-09-27, three runs tagged coupler-scan, 1 MHz steps, the tone on q2's line at -20 dBm. q1_q2 over 6.85-7.35 GHz: (1) 20260927-211451-900 with the calibrated x180 on q1 - no ZZ dip, as predicted (ZZ ~0.3-0.9 MHz against a 16 ns x180), no_line, pi_contrast 0.89 (the x180 on q1 survives the band-2 switch of its port); it also showed the no-pi reference arm seeing the coupler through q1's readout (0.1 bumps at 7.057 / 6.991 GHz) while the pi arm did not, which is why the dips are now read from the pi arm alone; (2) 20260927-213623-198 with the 2 us square selective pi - SUCCESSFUL, q1_q2_c f01 = 7.05695 GHz +- 0.13 MHz (dip 0.40 deep, 6.9 MHz wide, SNR 18), 0.5 MHz from pair_coupler_spectroscopy_swap's 7.0575 GHz the same day; f02/2 only a one-point dip, so no alpha; pi_contrast 0.80; its f_01_hz ACCEPTED (q1_q2_c.f_01_hz = 7.05695 GHz; the user: the two experiments agree closely enough). (3) q2_q3 over 6.9-7.4 GHz, 20260927-214341-704, the selective pi on q3 - SUCCESSFUL, q2_q3_c f01 = 7.15550 GHz +- 0.23 MHz (dip 0.31, 8.2 MHz wide, SNR 14; pair_coupler_spectroscopy_swap read 7.1555-7.1560), reference arm flat, pi_contrast 0.78, its f_01_hz ACCEPTED (q2_q3_c.f_01_hz = 7.15550 GHz). q2_xy's drive_power_dbm restored to 0 dBm every time. Suites in the environments ENVIRONMENTS.md names: scqat 958 passed (full, uv run --extra dev, at 9611e82) and the zz estimator file 14 passed at 1bd0899; scqo targeted - test_model_experiments -k 'coupler or runs_clean' 67 passed, test_capabilities + test_contract + test_one_estimator_per_experiment + test_docs_current + test_sweep_order 129 passed (uv run --extra viewer); scqo-qm 774 passed in .venv-qm (full), including the program and the moved-LO config BUILT on the live quam_state, and an offline --preview on the 5Q4C tree."
notes = '''NEW EXPERIMENT pair_coupler_spectroscopy_zz (additive, QM only, hardware-run on 5Q4C q1_q2 and q2_q3, agreeing with pair_coupler_spectroscopy_swap within 0.5 MHz): the coupler's 0-1 frequency at its idle point with the coupler never moving - experiment 2 of the three coupler tool experiments (BACKLOG F24, docs/coupler-readout-plan.md section 5). A tone on tone_on's drive line (default the low member: on 5Q4C q2, the more weakly coupled line for both couplers) excites the coupler when it hits a coupler transition; after the tone the OTHER member gets a pi, and while the coupler is excited the qubit-coupler ZZ detunes that member so a pi narrower than the ZZ misses and its population dips. Every frequency also runs a reference shot without the pi, back to back. Same absolute window as pair_coupler_spectroscopy_swap (at most 500 MHz, one LO at its centre, the MW-FEM band switched with the port-pair partner and the QUAM tree restored straight after the config is built).

THE PI is SELECTIVE: a square pulse selective_pi_len_ns long (default 2 us) with the rotation area of the member's calibrated x180 (its own frame detuning undone), played as the member's saturation with amplitude_scale and duration - no calibration of its own, no new waveform. Square rather than cosine or Gaussian because the coupler decays during the pulse (T1 ~5 us on 5Q4C): a smooth envelope needs about twice the length for the same selectivity (plan doc section 5 table). The calibrated x180 was tried first (user) and showed no dip. THE ESTIMATOR (new, 1:1) finds the dips of the pi member's PI ARM alone (on the negated trace - fit_peaks' own dip path mis-seeds its fits, a separate fix is suggested), reads f01 as the highest with every other dip on its multi-photon ladder, and reports pi_contrast; the reference arm is NOT subtracted - the pi member's readout sees the coupler only while the member is in 0, so a difference would dig false dips at the coupler's lines - and its own lines are listed as readout_lines_hz. WHAT IT WRITES (one SUCCESSFUL pair): the coupler mode's f_01_hz and, with an f02/2 dip, its anharmonicity_hz; no knob. ALSO: scqat gains tools/coupler_ladder.py (find_lines, lines_curve, read_ladder) shared with the swap estimator; SCQO gains experiments/_coupler_tone.py (CouplerToneParameters, tone_lo_hz); scqo-qm gains experiments/_coupler_tone.py (the moved-LO config, the band choice, the threshold gate, the config-bound acquire).'''
