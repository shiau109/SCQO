name = "pair-coupler-crossing-pulse"
repos = { scqat = "e0a942b", scqo = "80e4ca4", scqo-qm = "1834029" }
kind = "additive"
coupling = "scqo needs scqat >= e0a942b: a LOUD floor, and late - pair_coupler_crossing_pulse's estimate() imports scqat.estimators.pair_coupler_crossing, which does not exist before e0a942b, so the ImportError lands at ANALYSIS after the instrument time is spent; the dataset is saved and re-fits once scqat is current. scqo-qm needs scqo >= 80e4ca4 the usual way: the probe subclasses scqo.experiments.PairCouplerCrossingPulse, so against an older scqo the whole driver experiments package fails to import. scqo-qblox is untouched (the experiment is QM-only and Qblox does not register it)."
validated = "OFFLINE ONLY - no hardware run yet (owed: 5Q4C q1_q2, measure=both, b -0.498..+0.34 V at 2 mV, --no-update; plan doc section 3). Suites in the environments ENVIRONMENTS.md names: scqat 923 passed (full); scqo 1178 passed plus the one pinned CLI capability footer (test_cli_listing) extended and re-run (uv run --extra viewer); scqo-qm 756 passed in .venv-qm, including the program BUILT on the live quam_state and read back as QUA. Synthetic 5Q4C-shaped data (members 5.1446 / 4.8421 GHz, 2 mV grid, 300 shots) recover f_c_max within 0.1 GHz and the period within 1.5 %."
notes = '''NEW EXPERIMENT pair_coupler_crossing_pulse (additive, QM only, offline-validated): where a pair's tunable coupler crosses its two neighbours, and the coupler's apex, flux period and f_c_max behind it. The coupler plays a flux pulse swept RELATIVE to its idle_flux while each measured member plays an x180 at its own drive frequency; where the coupler crosses a member the two hybridize and that x180 misses, so the member's population dips. The crossings nearest idle pair up into a symmetry point; with measure="both" the member whose crossings are INNER says whether the coupler sits above them (the center is its apex) or below (anti-apex), and the two half-separations solve the transmon arch for the period and f_c_max. Experiment 1 of three coupler tool experiments (BACKLOG F24, docs/coupler-readout-plan.md).

WHAT IT WRITES (one SUCCESSFUL pair): flux_offset on the coupler's flux channel (the apex, re-referenced to ABSOLUTE as old_coupler_idle_flux + the fitted pulse-frame position) when the center is known to be the apex; flux_per_phi0 on that channel and f_q_max_hz on the coupler mode when the arch solved - model-dependent estimates, since two crossings ~300 MHz apart pin f_c_max only to a few hundred MHz. It NEVER proposes the coupler's idle_flux. The fit also reports every crossing (pulse frame, with stderr, dip width and depth), the arch's f_c_at_idle_hz, ec_hz_used, and the flags crossings_not_bracketed_high/low, center_mismatch, side_conflict, arch_unsolved (arch_unsolved alone does not fail the run). ONE pair per run, refused by name otherwise: the coupler line crosstalks 5-7 % onto non-neighbours. Needs state discrimination (a member without readout_threshold is refused before any QUA is built).

NEW CAPABILITY coupler_flux (CouplerFluxPulseSweepParameters: start/end_coupler_flux_v + num_coupler_flux_points, axis coupler_flux_v): a pair's COUPLER flux-pulse window, relative to the coupler's idle_flux - its only frame, so every carrier's name ends in _pulse (test-pinned) and the window is a traversal order like the other capability windows. `scqo run --capability coupler_flux` lists it; the capability footer of `scqo run` gains coupler_flux(n). New scqat estimator pair_coupler_crossing (1:1).'''
