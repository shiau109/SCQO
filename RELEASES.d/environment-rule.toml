name = "environment-rule"
repos = { scqat = "103f676", scqo = "fb02a82", "scqo-qm" = "a17a231", "scqo-qblox" = "57423fa" }
kind = "breaking"
coupling = "None inside the stack. scqat's requires-python narrows to the window SCQO, scqo-qm and scqo-qblox already pin, so no sibling resolution changes and no CI matrix moves; uv re-locked SCQO/uv.lock and scqo-qblox/uv.lock on their own and both are version catch-ups only. The break is OUTWARD: a third-party consumer on Python 3.13+ can no longer install scqat. Everything else here is documentation."
validated = "offline"
notes = """DOCS + one pyproject constraint, and one MEASURED bug in a documented command. WHY: four Python environments coexist across the stack and NO document stated the rule, so each repo's docs drifted into their own answer - operator docs (INSTALL/TUTORIAL/RELEASING) said the shared .venv-*, agent docs said `uv run` (the repo-local .venv), the contributor Setup blocks in SCQO/AGENTS.md, SCQO/CONTRIBUTING.md, scqat/AGENTS.md and scqo-qblox/AGENTS.md all built a `<parent>/.venv` that exists on no machine here, and CI uses bare pip with no uv at all. SCQO alone gave THREE different test commands for the same task. It had already cost real failures: on 2026-07-26 scqo-qblox/.venv held qblox-scheduler b4 while .venv-qblox held b6, the two disagreed about whether a schedule is legal, and readout_frequency compiled clean offline and DIED ON HARDWARE. NEW AUTHORITY: SCQO/ENVIRONMENTS.md - two global rules plus a PER-REPO table, because the answers legitimately differ and nobody having written that down is what let four arrangements grow. scqo-qm forbids `uv run` outright (its sync would displace requirements-qm.lock.txt, the pin authority for the whole qm-qua->quam->qualibrate stack), so one global sentence would have been WRONG. scqat, scqo-qblox and scqo-qm carry ~20-line stubs pointing at the GitHub URL and repeating their own command verbatim, exactly as the three CONTRIBUTING.md stubs already do - the rule is a combo property and separate copies disagree within one cycle. THE MEASURED BUG, and it is the reason this is not purely cosmetic: `uv run pytest -q` - the documented SCQO full suite - collects 917 tests instead of 984 on a CLEAN environment. The viewer stack is a root EXTRA and `uv run` installs only the default dependency-group, so tests/test_viewer.py's MODULE-LEVEL importorskip('fastapi') takes 54 tests with it and tests/test_lab_report.py's gates take 13 more - silently, reported as a pass. The lab machine cannot reproduce it: SCQO/.venv still had the extras lying around from an old `uv pip install -e \".[viewer]\"`, which is exactly what kept it hidden. Verified in a clean UV_PROJECT_ENVIRONMENT (917 bare, 984 with --extra viewer). Every full-suite instruction now carries `--extra viewer` and the words EXPECT ZERO SKIPS - a property, not a count, since CLAUDE.md already records how test counts rot here. UNSAFE LINE DELETED: INSTALL.md's `# expect: all passed (any env works; view is enough)`. 'any env works' is FALSE - experiments/__init__.py keeps the LAST registration (_REGISTRY[cls.name] = cls), so in .venv-qm or .venv-qblox a driver's @register'ed subclass answers under the core name and the suite passes having exercised the DRIVER's update(). tests/test_cli_backends.py already skipif's a test when a driver is present - the suite knew. 'view is enough' is true and stays; the two exclusions are now named. SCQO-QM IS A RULE REVERSAL, not a wording fix: CLAUDE.md told you to test in scqo-qm/.venv while its own AGENTS.md said the shared .venv-qm. AGENTS.md is right - that repo venv holds no `qm`, no `quam`, no `qualibrate` and no `scqat`, with scqo frozen at 2.3.0, so it cannot run the 11 test files CLAUDE.md's own table marks as needing the QM stack. The fallback is inverted: there is no repo-local venv for that repo, and one on disk is residue of a stray `uv run`. THE FOUR PHANTOM SETUP BLOCKS are REPLACED by `uv run`, not repaired: [tool.uv.sources] propagates across the sibling boundary (scqo-qblox/uv.lock carries scqat editable from ../scqat though its pyproject never mentions scqat), so `uv run` reproduces the sibling editables FROM THE TRACKED LOCKFILE, which a hand-built block cannot. The sibling clone layout stays a stated prerequisite - without it uv fails loudly, naming the missing path. BREAKING, one artifact: scqat's requires-python was \">=3.9\" with no ceiling while SCQO, scqo-qm and scqo-qblox all pin \">=3.10,<3.13\", so uv duly built scqat/.venv on Python 3.14.5 - the analysis half tested on a Python the rest of the stack cannot install on, and nothing said so. Now \">=3.10,<3.13\" plus a scqat/.python-version of 3.12; that pin file is NOT optional there, because scqat/.gitignore deliberately excludes uv.lock, so every contributor re-resolves and nothing else fixes the interpreter. UPGRADE REQUIRES: nothing inside this stack (every repo and every CI matrix is already 3.10-3.12; 3.9 was never in a matrix). OUTSIDE it: `pip install scqat` now FAILS on Python 3.13+ for a third-party consumer. scqat advertises itself as a general library, so that is a real cost, taken knowingly to stop the combo window from drifting. ALSO: scripts/check_contribution.py's four test commands now match the ENVIRONMENTS.md table, resolve the previously literal `<venv>` placeholder against the real .venv-qm/.venv-qblox paths when they exist, and warn when a scqo-qm/.venv is present; the .gitignore comment in SCQO and scqo-qblox claiming the real venvs never live inside a repo is now the opposite of the rule and was rewritten; scqat's .gitignore gained the venv block it alone lacked (harmless in practice - uv writes .venv/.gitignore = '*' - so it covers the hand-made `python -m venv` case); RELEASING.md step 1 names the environment per driver instead of 'their venvs'. NOT IN THIS CUT, deliberately: no environment was merged or deleted (both families have real reasons and the vendor stacks cannot coexist); no docs test pins the stub commands against check_contribution.py's table (queued in BACKLOG); scqo-qm/.venv itself is neither repaired nor removed, only documented as not-a-thing. OFFLINE-VALIDATED: scqo 984 passed with ZERO skipped (uv run --extra viewer, SCQO/.venv), scqat 707 passed on the rebuilt 3.12.13 env - identical to the 707 it passed on 3.14.5, so the dependency re-resolution moved nothing - scqo-qblox 333 passed in BOTH its uv run env and D:\\github\\.venv-qblox (the mandatory second run this cut documents), scqo-qm 434 passed in D:\\github\\.venv-qm. HARDWARE: none possible - the only non-documentation change is a Python version constraint."""
