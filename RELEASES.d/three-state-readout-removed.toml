validated = "offline 2026-09-25 - SCQO full suite 1078 passed, zero skips (uv run --extra viewer pytest -q; catalog.py is shared core, so the full run is the rule), and scqo-qm 726 passed, zero skips in .venv-qm, which is 729 minus the three gef tests removed with the experiment. Checked against the stored data rather than assumed: 0 rows for fidelity_f / pos_f_* across all three history.sqlite, and 0 occurrences of those keys in every scqo_state.json under this box's data_root. No hardware owed - the experiment has never produced a measurement here."
notes = '''The three-state (|g>/|e>/|f>) readout surface is REMOVED: the `single_shot_readout_gef` experiment (the SCQO shell and the QM probe), the readout channel's `fidelity_f` / `pos_f_i` / `pos_f_q` monitors, and the EF branch of the QM shared readout builder (`case_(2)` - x180, retune the drive element an anharmonicity down, EF_x180, retune back - plus the `readout_freq_shift_hz` argument no other caller passed).

WHY, and why now: preparing |f> needs a calibrated EF pi pulse, and the only path that ever calibrated one was the pair of official qualibrate nodes 12/13, which the qualibrate retirement removes (SCQO BACKLOG F21, decision 2). Neither node has run on this lab's hardware, so the experiment refused by name on every real tree and never produced a measurement. Rather than keep a surface with no way to satisfy its own prerequisite, it goes, to be rebuilt from scratch if a real need appears. `docs/greenfield-schema.md` keeps the three field names as the vocabulary a rebuilt version should reuse - re-adding a monitor is append-only-safe.

UPGRADE REQUIRES: `scqo run single_shot_readout_gef` no longer exists. `single_shot_readout` is the two-state measurement and remains the authority for `readout_rotation_rad` / `readout_threshold`, which it always was - the gef experiment deliberately proposed no discriminator, since a scalar threshold on one rotated quadrature cannot separate three blobs. Anything reading `fidelity_f` / `pos_f_i` / `pos_f_q` off a device gets a catalog error instead of a silent NaN.

NOTHING ELSE MOVES. scqat is untouched and needs no release: `state_discrimination` was never bound to this experiment alone - it is SHARED with `qubit_thermal_population` and `single_shot_readout`, both of which stay, and it sizes its mixture from the prepared states rather than hard-coding three. The known-shared-binding entry in `tests/test_one_estimator_per_experiment.py` shrinks from three experiments to two, which is the direction that list is allowed to move. Settled while here, since it looked like a fourth casualty: `qubit_thermal_population` prepares state [0] alone and fits TWO pinned centers, so it was never a gef experiment and is unaffected.

The `scqo run` menu block in TUTORIAL was refreshed from the real CLI output while removing the name from it; it had drifted by six experiments and the capability counts with it.'''
