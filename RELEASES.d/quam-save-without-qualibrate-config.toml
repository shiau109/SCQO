name = "quam-save-without-qualibrate-config"
repos = { scqo-qm = "1a354ab" }
kind = "fix"
coupling = ""
validated = "offline 2026-09-22 — scqo-qm full suite 671 passed in .venv-qm, zero skips, including the new tests/test_quam_save_hermetic.py (3): an OPX+/Octave tree BUILT by quam_builder, loaded through QMBackend.load and saved through the device with QUAM_CONFIG_FILE pointed at a missing file (the fixture asserts QUAM's own lookup raises, so the test cannot pass vacuously on a machine that has ~/.qualibrate), the save landing in the load folder with QUAM_STATE_PATH moved elsewhere and wiring still split out into wiring.json. Negative controls: with the root-class serialiser undone the build fails with the issue's FileNotFoundError; with a serialiser that REPLACES quam_builder's instead of extending it, wiring.json is never written (the existing test_vendor_config_snapshot_matches_the_state_files caught that version first). No hardware run: the instrument half of `scqo set` is untouched, only the state.json write changed."
notes = '''FIX (scqo-qm issue #38): on a machine that has never run qualibrate — no ~/.qualibrate/config.toml — `scqo set` on a QM setup pushed the new value to the instrument and then failed to save it ("values were applied to the device but saving state failed ... FileNotFoundError: ... .qualibrate"), so state.json kept the old value and the next session loaded it. QUAM looks `include_defaults` up in that file on every save that does not pass it, before it even considers the path; loading never reads the file, which is why only saving broke and why the load-only live-state tests never saw it.

Every scqo-side QUAM save now goes through scqo_qm.quam_io.save_state, which passes include_defaults=True — what the qualibrate stack writes, so the files are byte-for-byte the same on a machine whose config says true, as the lab's does. The lab QUAM root (MixedTransmonQuam, the root __class__ every lab state.json names) pins the same value on its serialiser, EXTENDING quam_builder's so its content_mapping still splits wiring/network into wiring.json; that covers the saves no scqo call site can pass it to — the bare machine.save() inside quam_builder's build_quam_wiring / build_quam, and the quam_config/register_* scripts. QMBackend.load() now hands the folder it loaded from to the device as its explicit save target: saves used to reach the right folder only because load() had set QUAM_STATE_PATH as a side effect, and QuamRoot.load(path) does not remember path. quam_config/convert_state_rf_literal.py now saves to the folder it was given — it loaded that folder, then saved wherever QUAM_STATE_PATH or qualibrate's [quam] state_path pointed, while printing "saved -> <folder>".

BEHAVIOR CHANGE: none where the qualibrate config says include_defaults = true. A machine whose config said false now writes default-valued fields for every save of a lab state, including the qualibrate GUI's own, because the pin sits on the root class.

UPGRADE: nothing to do. If a `scqo set` on a QM setup ever failed this way, the instrument and state.json disagree: re-run that `scqo set` once after upgrading.'''
