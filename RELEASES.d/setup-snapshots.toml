name = "setup-snapshots"
repos = { scqo = "4affc18", "scqo-qm" = "157cc70", "scqo-qblox" = "3d89824" }
kind = "additive"
coupling = "None that can fail silently. A driver older than this scqo simply produces no snapshot (Session resolves the two hooks with getattr and treats a missing one as the simulated case: setup_snapshot = {}); this scqo on an older driver likewise records {} and warns nothing. No stored file changes shape: record.json gains an optional key, old records load with the default."
validated = "offline"
notes = """ADDITIVE: every run now persists the SETUP SNAPSHOT it executed against, and `scqo restore <run_id> --setup <name>` turns one back into a named setup so an old configuration can be re-run for comparison. WHAT IS STORED: <data_root>/<device>/setup_snapshots/<hash16>/ holding backend_config/ (the vendor config as the backend held it IN MEMORY at run start, serialised exactly as its save() would write - QM state.json + wiring.json via the new QMBackend.vendor_config_snapshot (quam's content_mapping split reimplemented as the pure split_state_contents), Qblox dut_config.json + hw_config.json via QbloxBackend.vendor_config_snapshot / QbloxDeviceModel.config_texts, which save() now shares - plus every other regular file of the setup's backend_config/ folder verbatim, e.g. Qblox att_limits.json and mixer_cal.json), scqo/ (this context's scqo_state.json + physical.json values in their schema-3 file shape) and manifest.json (full sha256, per-file checksums, backend, cooldown/setup, the first run that produced it, and versions: scqo + the driver's `versions()` hook - scqo-qm/quam/qm-qua, scqo-qblox/qblox-scheduler/qblox-instruments). Content-addressed and write-once: identical content from any number of runs (a campaign's N x M children) lands ONCE; the folder is a sibling of the day folders like campaigns/, invisible to reindex and mirrored with the device folder. RECORD: record.json gains `setup_snapshot` = {hash, path, drift} (record.json-only like power_context - no index column, no schema bump; {} on the simulated backend; {"error": ...} when storing failed, the run is persisted regardless). DRIFT: the vendor text is taken again at the end of exp.run() (before update capture / apply); any file that changed is listed in `drift` and warned as a RuntimeWarning - a run-scoped mutation that missed its restore, or Qblox's legitimate _sync_att_limits re-solve. On the way, qubit_drag_equator's ref_alpha install/restore moved into a try/finally (a failing build used to leave ref_alpha on the live QUAM tree, where the next save() would persist it). RESTORE: `scqo restore <run_id> --setup <name> [--force] [--yes]` copies the snapshot into <device>/<active cycle>/<name>/ (backend_config/ + scqo/, no history.sqlite - the values show as (no record)) and appends [<cid>.setup.<name>] (backend + a note naming the run) to cooldowns.toml with the same append-then-reparse-then-rollback discipline as `scqo device cooldown start`; refuses a run from another cooldown unless --force, a name that exists (casefold) in the cycle, a run without a snapshot, a missing snapshot folder; warns when the manifest's versions differ from the installed distributions. Then `scqo user --setup <name>` and `scqo run <experiment> --params <run folder>/parameters.json`. VIEWER: the run page shows the snapshot hash with per-file links (new endpoint /device/<device>/setup_snapshot/<hash>/<file>, strict containment), the drift list when non-empty, and the restore command. DOCS: SCQO CLAUDE.md/TUTORIAL section 4 (+ "Re-running an old configuration")/INSTALL; both driver CLAUDE.md files (scqo-qblox's stale qblox_config/qblox_state layout lines corrected). NOT in this cut: experiment-reported run-scoped amendments (broadband LO/band tables, the cryoscope drive op) - the snapshot is the STANDING config at run start; a device-level snapshots page; the hash as an index column. OFFLINE-VALIDATED: scqo 968 passed (.venv-view), scqo-qm 434 passed (.venv-qm, incl. the live quam_state parsed-equality test), scqo-qblox 329 passed (repo .venv). HARDWARE: none needed for the snapshot itself (serialisation only); the first real run after upgrade should show <device>/setup_snapshots/<hash>/backend_config/state.json parsing equal to the setup's file, and a `scqo restore` + `scqo doctor` on the restored setup is the end-to-end confirmation."""
