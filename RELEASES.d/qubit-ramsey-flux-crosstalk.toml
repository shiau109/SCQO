name = "qubit-ramsey-flux-crosstalk"
repos = { scqat = "0eb4989", scqo = "3b58c2a", scqo-qm = "8ccb1ad" }
kind = "additive"
coupling = "scqo 0d16afb needs scqat >= 0eb4989 (estimate() lazy-imports scqat.estimators.qubit_ramsey_flux_crosstalk); scqo-qm 8ccb1ad needs scqo >= 0d16afb (QubitRamseyFluxCrosstalkPulse, the flux_source capability, source_lead_time_ns)"
validated = "hardware 5Q4C 2026-10-04 (the 12 pulse-frame cells of q1-q3 x z1/z2/z3/zc12/zc23, a lead-time scan to 3 ms on q1 <- zc12 plus two other cells, DC walks of zc12 and z2 as the reference; tags crosstalk-hwtest / crosstalk-matrix / crosstalk-lead / crosstalk-dc); offline scqat full 1026, SCQO full 1318, scqo-qm full 852"
notes = "New experiment qubit_ramsey_flux_crosstalk_pulse (QM only, record-only): the signed flux crosstalk m onto one qubit from another flux line (source_line: another qubit's z line or a coupler's). A Ramsey fringe with the target's own z line and the source line pulsed during the idle locates the target's flux apex at each source amplitude; the apex moves by -m times the source amplitude. The apex HEIGHT, which a coupler moves without crosstalk, is reported separately (apex_height_span_hz). New derived capability flux_source (source_line + start/end_source_flux_v on the axis source_flux_v, relative to the source line's idle_flux). source_lead_time_ns starts the source pulse earlier, so the fringe reads the crosstalk that long after the source step: m DEPENDS on it (5Q4C: fast values of -3.5..+4.2 % for pulses up to a few us; a DC move reads 6-9 points higher, reached with time constants of ~0.17 ms and ~1.6 ms; the slow part outlives a shot, so lengthen thermalization_time_ns to read a single step). scqat gains tools/local_arch.py and tools/flux_crosstalk.py and the estimator qubit_ramsey_flux_crosstalk; qubit_ramsey_flux_pulse's estimator now calls local_arch, results unchanged. procedures/qubit-frequency-park corrected: at DC a qubit line moves the other qubits' apexes by ~8 % (the ~1 % it quoted was the short-pulse value), plus the DC recipe and a trap (long flux pulses at a high duty cycle move the apexes). No upgrade action. Left out and open: SCQO BACKLOG F32 (no writeback - the crosstalk fact has no catalog home yet; no Qblox probe)."
