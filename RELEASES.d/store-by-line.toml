validated = "offline: SCQO full suite 1240 passed 0 skipped; scqo-qm 777 passed in .venv-qm with the live quam_state; scqo-qblox 374 passed in .venv-qblox; convert_store_v4 dry run + apply on a replica of D:\\qpu_data_dev, then on D:\\qpu_data_dev itself 2026-09-28 (13 files; 1875 pending 3.x suggestions on 452 runs/campaigns rejected; a re-run is a no-op), `scqo state` + `scqo doctor` clean on the converted 5Q4C cd2 context (offline); hardware 5Q4C q1 2026-09-28 on QPX1000_4: qubit_power_rabi (successful, pi_amp 0.2098 vs stored 0.2141) and single_shot_readout (successful, fidelity 0.954) with --no-update - run records, setup snapshot and frozen estimate inputs carry 4.0.0 names, the stores and history were untouched, the viewer renders the converted setup/run/trends pages"
notes = "STORED-DATA BREAK (MAJOR). Every stored value is addressed by its OWNER: a channel <line>.<target> (xy1.q1.pi_amp, feedline.q1.readout_freq_hz), a LINE (z1.idle_flux, z1.distortion_amp), the flux channel's transfer function (z1.q1.flux_per_phi0), a declared operation (q1_q2.iswap.coupler_flux); the store files nest by owner (schema 4) and a 3.x store is REFUSED by name. UPGRADE REQUIRES, per data root: decide the pending suggestions that matter on the 3.x install BEFORE upgrading (they carry 3.x names), upgrade the three repos, then `python scripts/convert_store_v4.py <data_root>` (dry run) and `--apply` (add `--reject-pending` to reject the rest); every converted file keeps a *.v3.bak. Scripts and notebooks using q1_xy / q1_ro / q1_z names must switch to the shorthand (q1.pi_amp, q1.idle_flux) or the new addresses - a refusal names the new address; `scqo accept --entity` keeps its name. BEHAVIOR CHANGE: any drive line can drive any drivable mode as a BORROWED channel (xy2.q1_q2_c) with no roster edit, realized once the vendor config adopts it (both drivers refuse until then); `scqo state` prints each line's instrument port; a power write re-reads every owner on the same line. Run data (dataset.nc, run records, setup snapshots) keeps its 3.x names and is read through scqo/v3_names.py; `scqo restore` of an old snapshot re-addresses its store files. External readers of the store files (the scqo-agent fork) must follow the new shape."
