name = "chain-stark-with-reset"
repos = { scqo = "0cdaf75", scqo-qm = "b53b442" }
kind = "additive"
coupling = "scqo-qm b53b442 needs scqo >= 0cdaf75: both chain probes import STARK_WITH_RESET from scqo.experiments.qc_unidirectional_trotter and read Parameters.stark_timing. SILENT with an older scqo: the driver package fails to import, scqo's entry-point discovery skips it, and the catalog holds only the core classes. SILENT the other way too: scqo >= 0cdaf75 with an older scqo-qm accepts stark_timing='with_reset' and the old probe plays the tones after the reset."
validated = "offline: SCQO tests/test_model_experiments.py -k 'trotter or compensation' 46, test_experiment_docs.py + test_docs_current.py + test_experiment_projects.py 246, test_experiment_outputs.py + test_cli_run.py -k 'trotter or compensation' 6; scqo-qm full 860 in .venv-qm; 25 builder calls over both chain probes render the same default-mode QUA as before the change, up to the element order of QUAM's own aligns"
notes = "New setting stark_timing on qc_unidirectional_trotter and qc_trotter_compensation: 'after_reset' (default, the round as it was) or 'with_reset', which starts a round's stark compensation tones together with the relay's parametric reset for a shorter round of the same circuit; with it a tone on the reset qubit is refused by name. QM only (neither chain experiment has a Qblox probe). No upgrade action and no behaviour change at the default: existing chain files and saved runs read as 'after_reset'. 'with_reset' has NOT run on hardware - its round length, the relay's reset under the tones and the rescanned compensation are owed (BACKLOG F17); a compensation measured at one stark_timing does not carry over to the other."
