name = "stark-compensation-readoff"
repos = { scqat = "4788791", scqo = "5a2096e" }
kind = "additive"
coupling = "scqo needs scqat >= 4788791, SILENTLY: estimate() lazy-imports the estimator and fills fit via .get(key, nan), so an older scqat imports fine, runs fine, and leaves every compensation field NaN with no error."
validated = "offline; the analysis re-run on measured hardware data (5Q4C q1_q2 run 20260908-173919, partial_swap) straight from its dataset.nc, no new hardware run"
notes = "qc_n_stark_amp stops being record-only in its ANALYSIS: at every stark amplitude the estimator now measures the transfer's oscillation along the swap count and reads off the COMPENSATING amplitude as the row whose oscillation is strongest and slowest (the two faces of cos(theta_eff) = cos(phi/2)*cos(theta_exch), the stark tone being the knob that nulls the inter-swap phase). result.fit gains the pick and its interpolated refinement, each criterion on its own, theta_eff at the pick, and n_osc_ok / osc_criteria_agree / min_osc_period; a second figure qc_n_stark_amp_compensation.png draws all of it, with the fitted cosine on a 10x-dense count axis. BEHAVIOR CHANGE, contained: the SUCCESS verdict is unchanged (min_transfer alone), so a map that transfers without oscillating stays SUCCESSFUL with NaN compensation fields; simulate() now models a PARTIAL swap (5-8 counts per cycle, edge row pinned at 2.5) instead of a full one, so offline qc_n_stark_amp data differs from previous releases. The amplitude criterion is measured off the RAW trace, never the cosine's fitted a: near the Nyquist period only a*cos(phi) is determined, and on the first hardware run a phantom a=0.355 on a row swinging 0.178 took the pick to the wrong end of the sweep. Reading a period at all ASSUMES no row swaps by more than pi/2 (period >= 2 counts) - past that an oscillation aliases and reads slower the faster it is, and nothing in the data reveals the violation - so run this map on a PARTIAL swap_operation and check min_osc_period, the map's fastest row, which the 5Q4C run put at 2.02."
