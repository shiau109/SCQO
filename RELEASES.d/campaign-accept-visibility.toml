name = "campaign-accept-visibility"
repos = { scqo = "06ef197", "scqo-qblox" = "6063786", "scqo-qm" = "a0e461e" }
kind = "additive"
coupling = "None that can fail silently. `Backend.release_instruments()` is an optional hook with a benign `[]` default on the ABC, resolved through getattr in Session — an older driver under this scqo simply releases nothing (exactly today's behaviour), and this driver under an older scqo is never called. `suggestion_notes` is a new TOP-LEVEL campaign.json key; nothing validates or rejects unknown manifest keys (load_campaign is a bare json.loads, _upsert_campaign enumerates fixed columns), so no schema bump and no reindex, and an older scqo reading a newer campaign.json just ignores it. The `extra=\"forbid\"` models cover only manifest[\"plan\"], which is untouched. `_campaign_suggestions` grew a third return value but is private."
validated = "offline"
notes = """ADDITIVE, and a reported bug: a campaign generated pending suggestions, wrote them to campaign.json, and then NEVER MENTIONED THEM — `cli/_campaign.py::execute` printed the summary and the statistics table and returned. The accept step was reachable only by someone who already knew to run `scqo campaign --show <id>`, a bare `scqo accept`, or the viewer. Since `scqo run --repeat N` diverts into that same campaign path, adding the flag to a plain `scqo run` SILENTLY REMOVED the accept prompt that command gives. THE ACCEPT STEP: both `scqo campaign <plan>` and `scqo run <name> --repeat N` now end in `review_campaign_interactively` — the campaign twin of the single-run review, written with the feature and until now reachable only from `scqo accept --campaign`. Off a terminal it degrades to the table plus the paste-ready `scqo accept --campaign <id>` (the shared `_review_core` TTY gate, unchanged). Two honesty branches instead of a command that cannot work: no data_root (suggestions are still generated without a datastore) and a failed final write (`persist_error`, which `format_summary` now also shows). The table itself moved into one authority, `_review.py::announce_suggestions`, so existing output is byte-identical. THE INSTRUMENT: new optional `Backend.release_instruments() -> list[str]`, called by `_review_core` after the TTY gate and before the prompt loop — nothing below the prompt needs a connection (a decision writes the in-memory config tree and the JSON stores; the values reach hardware at the next run, which reconnects), so an operator who walks away from an overnight campaign's prompt no longer pins the instrument. QM and the simulated backend keep the `[]` default: qm_session closes the QuantumMachine in its own finally, so an idle process holds no cluster lock (noted in scqo-qm CLAUDE.md next to close_qm, which answers a different question — a session that DIED mid-job). scqo-qblox implements it and is the reason the hook exists: HardwareAgent.run() calls connect_clusters() and the vendor has NO disconnect, so a process that acquired once holds four sockets per cluster until exit. It reads `_clusters` DIRECTLY (get_clusters() would CONNECT when nothing is connected) and closes each Cluster on a DAEMON thread joined with _CLUSTER_CLOSE_TIMEOUT_S = 15 s, because Cluster.close() can block forever — worst case a warning and a socket still held, exactly today's behaviour, never a hang; calibrate_mixers' `_hard_exit` answer is deliberately not reused inside a live session. Session.release_instruments degrades to [] on any failure (the statistics.png doctrine). WHY NOTHING WAS PROPOSED: `[writeback] min_n` defaults to 3, so a 2-repeat campaign proposed nothing and said nothing (`if not fit: continue`) — 2 and 3 repeats printed byte-identical output, which is why the accept step read as absent rather than empty. `_campaign_suggestions` now returns NOTES too, stored as the new `suggestion_notes` and rendered at the end of the run, in `scqo campaign --show` and on the viewer's campaign page beside the existing writeback problems (a separate channel: a shortfall is not an error). Per (experiment, target), NEVER per quantity — the statistics carry uncatalogued fit params (amplitude, offset) that could never become suggestions — and a second kind sits beside a problem so a bare `KeyError: 't1_s'` names the floor that caused it; the shortfall list holds only real numbers the floor alone held back, never a per-point array. `edit_campaign_suggestions` and `suggest_campaign` carry notes through, so a regeneration replaces them rather than leaving a stale explanation. NOT in this cut: a target whose statistic RESOLVED but is NaN still says nothing — a different cause with a different remedy (BACKLOG I9); no `--min-n` flag on `scqo run --repeat`. OFFLINE-VALIDATED: scqo 984 passed (.venv-view), scqo-qblox 333 passed (repo .venv). HARDWARE: the Qblox release is pinned offline with fakes only — that a real Cluster.close() returns inside the deadline and actually frees the four sockets needs a terminal run with the prompt left open while a second process connects."""
