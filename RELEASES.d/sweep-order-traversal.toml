name = "sweep-order-traversal"
repos = { scqat = "9305471", scqo = "288495b", scqo-qm = "f416665", scqo-qblox = "d50b9c0" }
kind = "breaking"
coupling = "scqo needs scqat >= 9305471, and this floor is SILENT: with the ascending detuning normalisation gone an axis can reach scqat descending, and an older scqat misfits it with no flag (peak_fit read a 4 MHz line as ~180 MHz; power_rabi measured the pi pulse from the TOP of a descending amplitude window; the notch circle fit raised). The drivers need scqo >= 288495b the usual way (their tests and the amp-limit messages name start_amp_factor/end_amp_factor). Take all four together."
validated = "offline, every suite in the environment ENVIRONMENTS.md names: scqat 910 passed (uv run --extra dev); scqo 1151 passed with ZERO skipped (uv run --extra viewer, before the rebase onto two BACKLOG-only commits); scqo-qm 745 passed in .venv-qm from main (no CI there); scqo-qblox 367 passed in BOTH scqo-qblox/.venv and .venv-qblox from main, qblox-scheduler 1.0.0b6 + qblox-instruments 1.3.0 in both. No hardware run: a descending sweep is pinned in the COMPILED program on both drivers (a QUA for_ with a negative increment or a decreasing for_each_ array; a sweep register that subs in the Q1ASM), never yet played on an instrument."
notes = '''UPGRADE REQUIRES renaming, in every parameters.toml and campaign plan: min_flux_v/max_flux_v -> start_flux_v/end_flux_v (flux_pulse carriers too) and min_amp_factor/max_amp_factor -> start_amp_factor/end_amp_factor (qubit_power_rabi, readout_power, qubit_resonator_stark, qubit_pi_pulse_error, qubit_deterministic_benchmarking); the old names are refused by name. BEHAVIOR CHANGE: start/end on the flux, detuning and amplitude windows is now the TRAVERSAL ORDER - the probe walks start -> end and dataset.nc keeps that order - so a window written high -> low is swept high -> low; a detuning window written that way used to be normalised ascending and is not any more. No fitted number depends on the direction: every scqat estimator reading one of those axes canonicalizes it on entry and carries a reversed-data test, and scqo tests the same on every carrier. Only a zero-width window is refused (new on the flux window); the amplitude bounds (>= 0, < 2) now bind BOTH edges. Also: Qblox refuses an unevenly spaced qubit_deterministic_benchmarking amp_prefactors list by name (it used to PLAY a different linspace under the list labels), and the offline readout_frequency simulator no longer raises on a descending window. Parametric-drive windows still normalise ascending (BACKLOG F26).'''
