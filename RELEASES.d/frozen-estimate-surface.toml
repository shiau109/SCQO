validated = "offline 2026-09-20 — SCQO full suite 1049 passed in SCQO/.venv (--extra viewer, 0 skips), including the new tests/test_estimate_inputs.py. Neither driver calls estimate(): scqo-qm's one run() override (qubit_spectroscopy_cryoscope) wraps super().run(), so it goes through run_estimate() unchanged, and scqo-qblox overrides no run(). No hardware run — none is needed for the numbers: the snapshot is taken exactly where the live reads used to happen, so a live run fits the same values as before by construction."
notes = '''BEHAVIOR CHANGE, none to a live run's numbers: estimate() no longer reads the LIVE device. Experiment.run_estimate() is now its only caller. On a live run it first embeds the acquisition-time snapshot into dataset.nc's global attrs — device knobs + monitors (scqo_device), physical facts (scqo_physical), the datasheet (scqo_design), the parameters (scqo_parameters), values run() computed for estimate() (scqo_acquisition) and the run's id / era / versions (scqo_run), under a format version (scqo_schema) — at exactly the moment the live reads used to happen (acquire done, boundary writes reverted, nothing fitted yet), and then runs estimate() against surfaces rebuilt FROM that snapshot, live runs included. What is stored and what is fitted cannot disagree, and a saved dataset can later be re-fitted against the values it was TAKEN with instead of today's. Why: resonator_spectroscopy rebuilds an absolute frequency through anchor(q, "readout_freq_hz"); once that run's own suggestion is accepted the live value has moved, and a re-fit against the live device adds the correction twice.

The frozen surface reuses the recording entity views, so reads behave identically by construction (a knob with no value raises KeyError and anchor() still falls through to the design seed; a monitor reads None; facts still come from physical.json's snapshot), and every WRITE from estimate() is refused by name (FrozenWriteError). Three in-tree experiments kept estimate inputs on the instance, where a re-fit (a fresh instance) cannot reach them; they now put them on the dataset through note_acquisition(): qubit_t1_bayesian's T1 prior and the two punchouts' top context / amplitudes / chain steps.

STORED DATA, additive only: every new dataset.nc carries the scqo_* attrs (~10 KB of JSON on a 5-qubit device; a stderr warning past 48 KB per attribute), which never reach scqat or plotdata.nc (stripped at the _scqat bridge); every record.json gains `versions` — the scqo / scqat / driver versions the run was ANALYSED with, which the setup snapshot's manifest cannot answer because it records only the FIRST run that produced that snapshot. Runs taken before this change are untouched and carry no snapshot.

FOR CODE OUTSIDE SCQO (forks, contrib) — nothing breaks, but: a run() override must call self.run_estimate(), never self.estimate(). One that still calls estimate() measures and fits against the live device exactly as before, but its dataset.nc is not self-contained, and Session.run() now says so in the run's stored result (`dataset_warning`), because the AST test in this repo cannot see a fork. A value run() computes for estimate() belongs in note_acquisition(), not on the instance.

NOT IN THIS CUT: this is P1 of docs/reestimate-plan.md. The `scqo estimate <run_id>` verb (P2) and its surroundings (P3) are BACKLOG F11 and will carry their own fragment.'''
