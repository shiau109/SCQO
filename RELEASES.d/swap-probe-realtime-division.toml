name = "swap-probe-realtime-division"
repos = { scqo-qm = "1a0682a" }
kind = "breaking"
coupling = ""
validated = "offline 2026-09-21 — scqo-qm full suite in .venv-qm, 662 passed, zero skips, including the new tests/test_swap_amplitude_realtime.py (15): the macro's rule, and every swept-amplitude swap probe built on the live quam_state with its generated QUA read back — no play carries an expression inside amp(). HARDWARE OWED: the simulator comparison of round timing and the A/B against qc_n_stark_amp named in the notes."
notes = '''BEHAVIOR CHANGE: the five probes that sweep a swap's flux amplitude — qc_swap_flux_stark, qc_n_swap_amp, pair_swap_angle, pair_swap_flux_map, pair_swap_chevron — no longer convert volts to an amplitude_scale IN FRONT of the swap's plays. Their data axes still carry volts; what changed is where the division runs.

WHY. The conversion used to run on the FPGA between a round's align() and the pulse: qc_swap_flux_stark's generated QUA read play("flattop_cosine"*amp((v12/0.1)), "q1.z") in every round, where qc_n_stark_amp's bare gate reads play("flattop_cosine", "q1.z"). On 5Q4C q1_q2 (2026-09-21) the two found the phase-compensating stark amplitude at 0.79 and 0.49 at the SAME flux (-149.7 mV; runs 20260921-123347-429 and -124233-223), which qubit_stark_phase_echo's measured phase curve puts 0.395 turn apart — and 0.410 turn at -150.0 mV against the 10:45 run. A constant offset, moving the same way with flux in both, and the size of two clock cycles of round time at that pair's 301.3 MHz detuning (0.205 turn per cycle). A calibration taken that way does not transfer to the gate it calibrates.

WHAT CHANGED. ISwapImplementation.apply gains ctrl_scale / cplr_scale: an amplitude_scale used verbatim, QUA variables welcome. ctrl_amp / cplr_amp remain the volts form but take Python numbers only and are divided in Python, so the chain shells' swap_coupler_flux path (a Python float) is byte-for-byte unchanged. The three single-pair probes sweep precomputed scales (volts / stored amplitude); pair_swap_flux_map (both its paths) and pair_swap_chevron, whose multiplexed pairs share one loop variable but not their references, assign the division per pair ahead of the reset.

UPGRADE REQUIRES — only for code of your own outside scqo: a call apply(ctrl_amp=<QUA variable>) or apply(cplr_amp=<QUA variable>) now raises TypeError. Precompute volts / the macro pulse's stored amplitude and pass it as ctrl_scale= / cplr_scale=. Python-number volts are unaffected.

OLD DATA. Runs of those five probes taken before this change carry the arithmetic in their timing. Their per-round PHASE is the affected quantity — qc_swap_flux_stark's compensating_stark_amp and its ridge, qc_n_swap_amp's N-oscillation — and so possibly is their ANGLE where the arithmetic sat in front of one of the swap's two pulses and not the other (pair_swap_angle's coupler, pair_swap_flux_map's direct path, the chevron's coupled path). Resonance centres are not timing effects and stand.

STILL OWED, on the lab PC: (1) scqo run qc_swap_flux_stark --preview against scqo run qc_n_stark_amp --set swap_counts=[5] --preview, both with --set thermalization_time_ns=2000 --simulate-ns 30000 — the q1.z pulse interval per round must now be equal, which also answers whether amp(<variable>) itself, the one difference left from the bare gate, costs any time; (2) a flux map and a qc_n_stark_amp at the same flux must now agree on the compensating amplitude.'''
