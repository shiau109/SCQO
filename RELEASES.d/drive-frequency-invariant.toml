notes = """BEHAVIOR CHANGE on the QM backend only (scqo, scqat, scqo-qblox untouched). drive_freq_hz used to write f_01 and then MOVE xy.RF_frequency by the same delta, preserving whatever offset the state file carried between the two; it now writes ONE absolute value to both, which is what the official qualibrate nodes do (03a_qubit_spectroscopy and 06a_ramsey write the pair). The drive line plays xy.RF_frequency - QUAM derives intermediate_frequency = RF - LO from it and every probe's update_frequency starts there - while scqo reads f_01 back, so an offset between them made drive_freq_hz report a frequency the hardware never emitted (reproduced offline: hand-edit f_01 to 5.010 GHz, scqo set 5.002e9 landed the tone at 4.992 GHz). UPGRADE REQUIRES: the QM session factory (scqo_backend.build_backend, so every `scqo run` AND `scqo set` on a QM device) now REFUSES a state.json in which any qubit's f_01 and xy.RF_frequency differ by more than 1 Hz (quam_fields.drive_frequency_problems, the third whole-tree audit beside the two flux ones), naming the qubit, both numbers and the fix; the remedy is a hand edit of state.json so both hold the intended value (the audit cannot know which one is right, and `scqo set` cannot help because it goes through the same factory). Uncalibrated qubits (f_01 null - state_lib/10Q, quam_state_6q) and unresolved RF references are skipped, never flagged. The live 5Q4C quam_state already complies bit-for-bit, so nothing changes for it today. KNOWN WAY BACK IN: the vendored calibrations/17_pi_vs_flux_long_distortions.py shifts xy.RF_frequency alone (LO tracking); a GUI run of it leaves exactly the offset the next scqo session refuses - re-align f_01 by hand afterwards. Also removed: the dead delta helpers quam_fields.shift_drive_freq / shift_readout_freq / _seed_f01_if_unset (no live caller since the LCH shells retired); the test stub tree drops its deliberate +100 MHz f_01/RF offset. NOT in this cut, deliberately: get_drive_freq still reads f_01 alone, and scripts/check_real_config.py still runs no audits. OFFLINE-VALIDATED: scqo-qm 430 passed (D:\\github\\.venv-qm, full suite incl. the live quam_state tests; 3 delta tests removed, 2 replaced, 9 guard tests + 1 factory-level audit test added). HARDWARE: nothing newly owed - the write path is the same QUAM attribute pair the official nodes already exercise on 5Q4C."""
