notes = '''NEW (scqo-qm): the `scqo-qm <command>` console script reaches every QM operator command - `scqo-qm -h` lists them, from the same OPERATOR_COMMANDS inventory `scqo state --fields` renders. New read-only `scqo-qm cluster`: the Quantum Machines open on the active setup's cluster (every user's) and each one's running / queued jobs with their start times; on QOP 2.x only the running job is visible, and it says so. UPGRADE REQUIRES: re-run the INSTALL §1 `uv pip install -e` line for .venv-qm, or `scqo-qm` does not exist.

BEHAVIOR CHANGE: the operator commands are now spelled `scqo-qm apply-distortion`, `scqo-qm calibrate-octave`, `scqo-qm close-qm`, `scqo-qm register-partial-swap` (the cryoscope writeback hint prints the new form); `python -m scqo_qm.backend.<name>` is no longer documented. This supersedes the `python -m scqo_qm.backend.register_partial_swap` invocation in the register-partial-swap fragment of the same combo. `close-qm --dry-run` is REMOVED - look first with `scqo-qm cluster`.

DOCS (SCQO): procedures/pair-partial-swap uses the new form; BACKLOG F19 (the remaining read-only queries: swaps, octave, filters) and F20 (the same CLI on scqo-qblox).'''
