notes = '''NEW (qc_trotter_compensation): result.fit reports best_compensation_amp_refined +- best_compensation_amp_err, the parabola vertex of the sink averaged over rounds >= 2 (rounds 0-1 carry no phase) within +-0.08 of that curve's grid best, with its spread from resampling the rounds, and compensation_unresolved = 1 (value NaN, refine_reason in the estimator metadata) when the curve shows no interior peak. That is the value to feed back as compensation_amps. best_compensation_amp is unchanged and stays the raw brightest (amplitude, round) pixel, which one noisy pixel moves: on 5Q4C it sat 0.02-0.04 off the ridge, enough to cost a third of the sink. Both figures draw the refined optimum solid with its spread and the brightest pixel dotted; the scan figure adds the averaged curve and the parabola.

