name = "pair-coupler-spectroscopy-swap"
repos = { scqat = "5f1d7e1", scqo = "5c59333", scqo-qm = "34e9716" }
kind = "additive"
coupling = "scqo needs scqat >= 5f1d7e1: a LOUD floor, and late - pair_coupler_spectroscopy_swap's estimate() imports scqat.estimators.pair_coupler_spectroscopy_swap, which does not exist before it, so the ImportError lands at ANALYSIS after the instrument time is spent; the dataset is saved and re-fits once scqat is current. scqo-qm needs scqo >= 5c59333: the probe subclasses scqo.experiments.PairCouplerSpectroscopySwap and reads ramp_v through its ramp_play_order(); against an older scqo the Parameters carry other ramp fields and the probe fails before any QUA is built. Builds on pair-coupler-crossing-pulse (its ramp end comes from that experiment's crossings, and the pair gate one_coupled_pair_problems now lives in that module); take both together, as a combo checkout does. scqo-qblox is untouched (QM-only)."
validated = "HARDWARE 5Q4C q1_q2 and q2_q3 (cd2/qm_5q) 2026-09-27, 15 runs tagged coupler-scan, all --no-update, all restored (device unchanged, no drift): q1_q2_c f01 = 7.058 GHz at idle 0.16 V with alpha ~ -135 MHz (6.991 = f02/2, 6.921 = f03/3; the ladder moves +88..+96 MHz when the coupler idle is moved to 0.15 V and back). Swapping on the way out (ramp (0.08, 0.14)) found NO swap peak on 5Q4C (the readout resonators sit between the coupler and the qubits); swapping on the way back ((0.14, 0), run 20260927-184406-667) is SUCCESSFUL at 7.0575 GHz. Known gaps for a follow-up: the estimator reads the probe marginal only (the swap lands mostly on the other member) and misses sub-resolution lines; q2_q3_c f01 = 7.156 GHz at idle 0.06 V, alpha ~ -148 MHz (runs 20260927-193705-615 / -193936-438 through q2's line; through q3's line the estimator picked the f02/2 line at 7.082 - the ladder-aware pick is owed). Suites in the environments ENVIRONMENTS.md names: scqat 931 passed (full); scqo targeted - test_model_experiments -k 'coupler or runs_clean' 62 passed, test_capabilities + test_contract + test_one_estimator_per_experiment + test_docs_current + test_sweep_order 129 passed, and the drive_power_boundary callers (-k 'spectroscopy or stark or broadband') 53 passed (uv run --extra viewer); scqo-qm 767 passed in .venv-qm, including the program and the moved-LO config BUILT on the live quam_state."
notes = '''NEW EXPERIMENT pair_coupler_spectroscopy_swap (additive, QM only, hardware-run on 5Q4C q1_q2 and q2_q3): the coupler's 0-1 frequency at its idle point. A tone on one pair member's drive line (the PROBE; its saturation operation at tone_power_dbm, set for the run and restored exactly) excites the coupler when it hits f_c; a slow flux ramp then carries the coupler across the probe adiabatically, so the excitation swaps into it, and a sudden return to idle leaves it there - the probe's population peaks at f_c. Every frequency also runs a REFERENCE shot without the ramp, back to back: a line the reference arm shares is not the coupler (reference_feature). Experiment 3 of three coupler tool experiments (BACKLOG F24, docs/coupler-readout-plan.md section 4).

THE RAMP is set by its slope (ramp_rate_v_per_us, default 0.15 V/us - 99 % adiabatic at g = 50 MHz on 5Q4C q1_q2): ramp_on picks the coupler's line (default) or the probe's own z. THE RAMP is ONE ramp_v = (first, last) in PLAY order: jump to first, linear to last at ramp_rate_v_per_us, drop to idle; only that slow segment is adiabatic and the member it crosses first receives the excitation. (0, 0.14) swaps on the way out; (0.14, 0) jumps out and swaps on the way back - the one that works on 5Q4C, where the readout resonators sit between the coupler and the qubits. No default: the far end is pair_coupler_crossing_pulse's crossing plus ~30 mV, refused by name when missing. THE WINDOW is absolute Hz and at most 500 MHz (one LO at its centre, +-250 MHz of IF); on QM the run gets its own config with the probe's port at that LO, switched to the least disruptive MW-FEM band (5Q4C q1: band 1 -> 2, the port-pair partner q2 follows the band and keeps its 4.9 GHz LO), and the QUAM tree is restored straight after the config is built, so nothing drifts. MW-FEM only.

WHAT IT WRITES (one SUCCESSFUL pair): the coupler mode's f_01_hz (its frequency at the CURRENT idle). No knob. The fit reports f_c_hz with stderr, fwhm_hz, peak_height, snr, n_peaks, the flags no_peak / multiple_peaks (a second ramp-only line, e.g. the coupler's two-photon 0-2 transition at high power) / reference_feature / peak_at_edge, and lo_hz, ramp_duration_ns, old_ramp_idle_flux. ALSO: scqo's drive_power_boundary takes an optional targets= (default unchanged). The new scqat estimator runs fit_peaks with its merge OFF and gates each fit on its own amplitude-to-noise, because the tool's area-ranked merge let a broad sub-noise fit swallow a real narrow line (a separate fix to the tool is suggested, not in this feature).'''
