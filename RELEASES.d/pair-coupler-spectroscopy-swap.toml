name = "pair-coupler-spectroscopy-swap"
repos = { scqat = "04e5b75", scqo = "fd67e44", scqo-qm = "20c7976" }
kind = "additive"
coupling = "scqo needs scqat >= 04e5b75: a LOUD floor, and late - pair_coupler_spectroscopy_swap's estimate() imports scqat.estimators.pair_coupler_spectroscopy_swap (absent before 5f1d7e1), reads the v2 keys alpha_hz / n_coupler_lines / n_ladder_lines / landing_* / no_line / unexplained_lines (absent before 5c8db04) and passes tone_on= (an older estimator raises unknown kwargs), so the ImportError, KeyError or ValueError lands at ANALYSIS after the instrument time is spent; the dataset is saved and re-fits once scqat is current. scqo-qm needs scqo >= fd67e44: the probe subclasses scqo.experiments.PairCouplerSpectroscopySwap, reads ramp_v through its ramp_play_order() and reads tone_on (was probe); against an older scqo the probe fails before any QUA is built. Old runs' parameters.json carry probe=, not tone_on= - no shim (immutable run data), so they re-fit only with a hand-edited parameter set. Builds on pair-coupler-crossing-pulse (its ramp end comes from that experiment's crossings, and the pair gate one_coupled_pair_problems now lives in that module); take both together, as a combo checkout does. scqo-qblox is untouched (QM-only)."
validated = "HARDWARE 5Q4C q1_q2 and q2_q3 (cd2/qm_5q) 2026-09-27, 15 runs tagged coupler-scan with the v1 estimator, all --no-update, all restored (device unchanged, no drift): q1_q2_c f01 = 7.058 GHz at idle 0.16 V with alpha ~ -135 MHz (6.991 = f02/2, 6.921 = f03/3; the ladder moves +88..+96 MHz when the coupler idle is moved to 0.15 V and back); q2_q3_c f01 = 7.156 GHz at idle 0.06 V, alpha ~ -148 MHz. Swapping on the way out (ramp (0.08, 0.14)) found NO swap peak on 5Q4C (the readout resonators sit between the coupler and the qubits); swapping on the way back ((0.14, 0)) works. The v2 estimator (same day) is validated OFFLINE on all 16 saved runs: the fast-then-slow q1_q2 runs through q2's line read f01 = 7.0577-7.0589 GHz, q2_q3 through q3's line now reads 7.1558 (v1 took f02/2 = 7.082), through q2's line 7.1556-7.1560; no alpha came out because at the runs' 2 MHz steps every f02/2 was 1-2 points wide (v2 then ran on HARDWARE: q1_q2 at 1 MHz steps, 6.85-7.35 GHz, tone on q2's line at -20 dBm, run 20260927-203446-486 - SUCCESSFUL, f01 = 7.0575 GHz +- 0.35 MHz, one coupler line, so no alpha: f02/2 does not show through q2's line at that power; its f_01_hz proposal was later REJECTED as superseded by pair_coupler_spectroscopy_zz's 7.05695 GHz, which the user accepted; q2_xy's power restored); one known misread - a slow-then-fast run through q1's line at -10 dBm (20260927-183300-636), where f01 is no line in the ramp arm, reads f03/3 = 6.921 as a SUCCESSFUL f01 (BACKLOG F24 (b)). Suites in the environments ENVIRONMENTS.md names: scqat 938 passed (full, uv run --extra dev); scqo targeted - test_model_experiments -k 'coupler or runs_clean' 67 passed, test_capabilities + test_contract + test_one_estimator_per_experiment + test_docs_current + test_sweep_order 129 passed (uv run --extra viewer); scqo-qm 768 passed in .venv-qm (full), including the program and the moved-LO config BUILT on the live quam_state. After the tone_on rename: scqat swap + coupler_ladder tests 21 passed, scqo test_model_experiments -k 'coupler or runs_clean' 67 passed, scqo-qm 774 passed (full)."
notes = '''NEW EXPERIMENT pair_coupler_spectroscopy_swap (additive, QM only, hardware-run on 5Q4C q1_q2 and q2_q3): the coupler's 0-1 frequency (and anharmonicity) at its idle point. A tone on one pair member's drive line (tone_on - named probe until 2026-09-27, renamed to match pair_coupler_spectroscopy_zz; its saturation operation at tone_power_dbm, set for the run and restored exactly) excites the coupler when it hits a coupler transition; a slow flux ramp then carries the coupler across a member adiabatically, so the excitation swaps into it, and a sudden return to idle leaves it there. Which member receives it differs by pair (5Q4C: q1 of q1_q2, q2 of q2_q3), so the signal is the pair's total excitation 1 - P00. Every frequency also runs a REFERENCE shot without the ramp, back to back. Experiment 3 of three coupler tool experiments (BACKLOG F24, docs/coupler-readout-plan.md section 4).

THE ESTIMATOR reads f01 as the TOP of the coupler's multi-photon ladder: lines are the ramp arm's peaks at least two sweep steps wide (a line of 1-2 points is a measurement problem - re-measure finer); coupler lines are those the ramp CHANGES (ramp minus reference, projected on the line's own shape - a reference-arm line does not veto, since a neighbour's readout can see the coupler directly, as 5Q4C q1 sees q1_q2_c); the highest coupler line is f01 and every other must sit on its ladder (f02/2 = f01 + alpha/2, f03/3 ~ f01 + alpha, alpha in -50..-400 MHz) or the run FAILS (unexplained_lines). Driven through the more strongly coupled member's line, f01 broadens and f02/2 becomes the strongest line - height never picks f01; drive through the weaker line (5Q4C: q2's, tone_on='low' for both couplers). The member-only lines are listed as member_lines_hz.

THE RAMP is set by its slope (ramp_rate_v_per_us, default 0.15 V/us - 99 % adiabatic at g = 50 MHz on 5Q4C q1_q2): ramp_on picks the coupler's line (default) or the tone member's own z ('tone_member'). THE RAMP is ONE ramp_v = (first, last) in PLAY order: jump to first, linear to last at ramp_rate_v_per_us, drop to idle; only that slow segment is adiabatic and the member it crosses first receives the excitation. (0, 0.14) swaps on the way out; (0.14, 0) jumps out and swaps on the way back - the one that works on 5Q4C, where the readout resonators sit between the coupler and the qubits. No default: the far end is pair_coupler_crossing_pulse's crossing plus ~30 mV, refused by name when missing. THE WINDOW is absolute Hz and at most 500 MHz (one LO at its centre, +-250 MHz of IF), 501 points by default (1 MHz steps); on QM the run gets its own config with the tone member's port at that LO, switched to the least disruptive MW-FEM band (5Q4C q1: band 1 -> 2, the port-pair partner q2 follows the band and keeps its 4.9 GHz LO), and the QUAM tree is restored straight after the config is built, so nothing drifts. MW-FEM only.

WHAT IT WRITES (one SUCCESSFUL pair): the coupler mode's f_01_hz (its frequency at the CURRENT idle) and, when the ladder shows f02/2, its anharmonicity_hz. No knob. The fit reports f_c_hz and alpha_hz with stderrs, fwhm_hz, peak_height, snr, n_coupler_lines, n_ladder_lines, landing_high / landing_low (where the swap landed - diagnostic), the flags no_line / unexplained_lines / peak_at_edge, and lo_hz, ramp_duration_ns, old_ramp_idle_flux. ALSO: scqo's drive_power_boundary takes an optional targets= (default unchanged), and scqat's tools.peak_fit.fit_peaks takes polarity='auto'|'peak'|'dip' (default 'auto', unchanged) - its automatic choice takes two similar-height lines for a dip and returns no line (a fix of 'auto' is suggested separately). The estimator also runs fit_peaks with its merge OFF (its area-ranked merge let a broad sub-noise fit swallow a real narrow line; a tool fix is suggested separately) and a 2x-width fit window (at 5x a broadened f01 fits the stronger f02/2 beside it).'''
