name = "vendor-surface-discoverability"
repos = { scqo = "5e40ede", "scqo-qm" = "769581b", "scqo-qblox" = "df05e21" }
kind = "additive"
coupling = "One-way, and only in that direction: BOTH drivers need scqo at 5e40ede or later, because their fieldmap now imports OperatorCommand from scqo.fieldmap and an older core makes that an IMPORT-TIME failure (the whole driver stops loading, not just this view). scqo 5e40ede against OLD drivers is fine - operator_commands() is an ABC method with a benign () default resolved through getattr, so an un-upgraded driver simply renders no command section. scqat untouched (no estimator, tool or fitter changed), so this feature's chain is scqo -> drivers with no scqat link. The two driver commits are independent of each other."
validated = "offline"
notes = """UPGRADE REQUIRES: nothing - additive, and one crash becomes output. WHY: a backend carries two kinds of thing `scqo -h` structurally cannot show, and an operator was memorizing both. (1) Vendor-config fields they hand-edit - QM's band / upconverter_frequency / full_scale_power_dbm under state.json ports.mw_outputs, Qblox's lo_freq / output_att in hw_config.json - were mostly inventoried already (VENDOR_ONLY, rendered by `scqo state --fields`), but the OPERATIONAL facts sat as prose mid-sentence inside `doc`: what must move with what, what to satisfy before editing, the other vendor's name for it. (2) The vendor OPERATOR CLIs each driver ships had no inventory at all - `python -m scqo_qm.backend.close_qm` was reachable only from its own module docstring and CLAUDE.md, which is the worst case, because the symptom it fixes (a job stalling forever on a cluster whose locks a dead session still holds) reads exactly like an experiment bug. NEW SHAPES in scqo/fieldmap.py: VendorOnly gains `coupled` / `edit` / `counterpart`, and OperatorCommand (name / command / doc / options / caution) is new. All three VendorOnly attributes STAY OPTIONAL and no test may demand them - several shipped entries have no counterpart prose to extract, and QM has two realizers (coupler_interaction_offset, coupler_arbitrary_offset) whose governed write is not reachable at all because the factory pins flux_point off, so a filled-in `edit` there would be a false runbook; both driver glue tests carry a comment saying why the obvious assertion is absent. The `unique` tier keeps its lock-in claim in `doc`, where the glue tests already read it, rather than duplicating it into `counterpart`. NEW HOOK: Backend.operator_commands() -> tuple[OperatorCommand, ...], an ABC method with a benign () default, resolved through getattr like vendor_only/versions/power_context - NOT the duck-typed preview/distortion_apply_command shape, because "this backend declares no operator commands" is a true, useful, non-exceptional answer (the simulated backend's answer forever) and this cut adds no refusal path. Zero-argument on purpose: half the inventory takes no --target and `--fields` is a schema view with none in hand, so entries carry <placeholder> arguments and the driver tests can keep calling it UNBOUND (QMBackend.operator_commands(None) == OPERATOR_COMMANDS) the way they already do for vendor_only. RENDERING: both halves land at the end of `scqo state --fields` (--json for machines); `scqo doctor` gets ONE static pointer line, deliberately placed before load_lab_config so it cannot construct a backend even by accident - doctor's "touches no instrument, writes nothing" promise is preserved structurally, and the line still renders when the config is what is broken. A driver whose hook RAISES degrades to a payload key plus one `# WARN:` line and the view still exits 0; the three catalog hooks are deliberately NOT wrapped, since swallowing there would print a false "declares no field bindings" and silence a real drift alarm. LIVE BUG FIXED IN PASSING, found while adding the fourth hook to the same function: _fields_payload called field_bindings/unrealized/vendor_only by DIRECT attribute access, and testing.SimulatedBackend is not a Backend subclass - so `scqo state --fields` raised AttributeError on EVERY `backend = "simulated"` setup, including the device-less demo. Nothing caught it because no test file in SCQO/tests imported scqo.cli.state; the already-written "this backend declares no field bindings" line was unreachable because the crash was three lines earlier. tests/test_cli_fields.py is that view's first coverage and pins the regression, --json purity, the asdict() property that carries a future VendorOnly attribute into --json with no edit at the call site, and the degraded path. QM SPECIFICS: `band` is now declared as three entries (readout_band, drive_band, downconverter_band), each named to sit beside the LO it covers and each naming that LO in `coupled`. It was not dormant metadata - broadband_resonator_spectroscopy reads it to derive the LO limits it may step within, and broadband_qubit_spectroscopy WRITES it run-scoped, one value per frequency segment, restoring the original in a finally. kind="vendor" and NOT "unique": unique asserts the touching experiment is locked to this instrument, and broadband_qubit_spectroscopy is registered on Qblox too. NO NUMERIC BAND EDGES ARE DECLARED and no claim is made about which of this repo's three disagreeing MW-FEM band tables is right (broadband_qubit_spectroscopy._MW_FEM_BANDS, broadband_resonator_spectroscopy's inline copy, and populate_quam_lf_mw_fems.get_band all differ on band 1's ceiling and band 3's floor): coverage is the INSTRUMENT's call - a band that does not cover the frequency comes back as a QM error - so a fourth table here would only add a source of truth, and the maintainer's call (2026-09-07) was to skip that validation entirely. One rotted fact corrected while verifying downconverter_band: the shipped doc quoted "chipA: 6.06 GHz" for the downconverter LO, two revisions stale (the repo's dev state runs 5.95 GHz, the live chipA config 5.1 GHz) while the EQUALITY with the readout upconverter, the durable claim, held throughout - the number is gone, the equality stays. QBLOX SPECIFICS: the one place the backfill does more than move text is the no-live-session rule - readout_lo_freq carried it in full while drive_lo_freq and output_att carried POINTERS to it, so each row now states it itself (which file, that a session's save() would silently revert the edit, restart kernels after). readout_input_att gains the only `coupled` in that table (readout_threshold + readout_rotation_rad, from its own "edits silently invalidate every discrimination value"), which is exactly why `coupled` admits neutral field names as well as VENDOR_ONLY keys - restricting it to one tier would have left that coupling in prose. calibrate_mixers prints its no-live-session PRECONDITION only at RUNTIME, i.e. after the operator has started it, so the inventory carries the same sentence where it can be read BEFORE and test_mixer_calibration.py pins the literal phrase in both places. NOT DONE, deliberately: distortion_apply_command is untouched - it builds a RESOLVED command an operator pastes verbatim while the inventory carries a <placeholder> template, two artifacts on purpose; deriving one from the other would invent a placeholder-substitution contract nothing else needs, so a test pins them to the same module instead. No `band` entry in FIELD_BINDINGS, UNREALIZED, quam_fields or scqo/catalog.py - inventory only; promotion to a neutral field is a release-review decision, never a side effect of a docs change. No band-coverage audit and no reconciliation of the three tables. No provenance stamp for band (power_context stamps the LO and full_scale_power_dbm but not band): already covered by BACKLOG F3, which names it verbatim, so no duplicate entry was opened. No new scqo subcommand. OFFLINE-VALIDATED: scqo 1001 passed with ZERO skipped (uv run --extra viewer, SCQO/.venv), scqo-qm 436 passed in D:\\github\\.venv-qm, scqo-qblox 336 passed in D:\\github\\.venv-qblox. MANUAL: `scqo state --fields` renders both new sections against the live 5Q4C cd2 qm_5q setup, and `scqo doctor` shows the pointer row with its exit code unchanged. HARDWARE: none possible - nothing in this cut reaches an instrument."""
