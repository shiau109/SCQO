kind = "breaking"
coupling = ""
validated = "offline 2026-09-25 - scqo-qm full suite 729 passed in .venv-qm, zero skips, INCLUDING the new tests/test_quam_io_door.py (9, the AST scan and its rule-shape pins) and tests/test_lib_fetcher.py (5, the vendored contract), and with the whole suite run against a QUAM_CONFIG_FILE that does not exist. THE PROOF: the same 729 passed in a scratch venv built from requirements-qm.lock.txt with the qualibrate and qualibration-libs lines removed - neither package importable, only quam's own qualibrate-config present. SCQO: test_model_experiments -k 't1 or bayesian' + test_capabilities 6 passed, test_docs_current 3 passed (the change there is the experiment description). The vendored copies were diffed line by line against the installed 0.2.1: identical bar one import line each. HARDWARE OWED: qubit_t1_bayesian on a setup whose alpha/beta come from an accepted single_shot_readout rather than a QUAM matrix - the numbers are build-time constants either way, so what is owed is the operator path, not the QUA."
notes = '''PHASE 1 of retiring qualibrate (SCQO BACKLOG F21): the QM driver now runs with neither `qualibrate` nor `qualibration-libs` installed. Nothing is deleted yet - the dependencies, the vendored GUI nodes and the docs come out in the removal phase, once the operator decisions in F21 are made.

WHAT CHANGED. (1) The two pieces `_lib` uses - BatchableList and XarrayDataFetcher - are COPIED into scqo_qm/_vendored/qualibration_libs/ with their BSD-3 licence and upstream commit (09fc735). Neither ever imported qualibrate; the DISTRIBUTION required it, which is how a GUI stack (fastapi, uvicorn, sqlalchemy, psycopg2) reached every QM environment. The copies are byte-identical to upstream except the intra-package import that cannot resolve once the files move. (2) `scqo_qm.quam_io` is now the DOOR for both directions: `load_state(path)` joins `save_state(machine, path)`, both naming the folder, and an AST scan (tests/test_quam_io_door.py) refuses a bare `Quam.load()` or a no-argument `.save()` that does not state `include_defaults`. Its two literals are the census: the build scripts allowed a bare load (quam_builder saves the tree it builds and takes no path, so each sets QUAM_STATE_PATH to a folder it owns), and the receivers whose `.save()` is not a QUAM tree. A QUA stream save always names its tag, and that positional argument is what tells them apart. (3) The whole scqo-qm suite now runs with `QUAM_CONFIG_FILE` pointed at a file that does not exist, so anything leaning on ~/.qualibrate fails in the suite rather than on a fresh machine - which is how issue #38 reached an operator.

UPGRADE REQUIRES. (a) The QM registration scripts take the state folder now: `python quam_config/register_stark.py <state folder>` (same for register_flattop_cosine / register_reset_macro / register_swap_macro), and the two `populate_quam_*.py` state it as STATE_DIR at the top, the shape generate_quam.py already had. They used to write wherever QUAM_STATE_PATH or qualibrate's `[quam] state_path` pointed, which on a machine whose repos have moved is a tree nobody loads (BACKLOG I22, closed by this). (b) qubit_t1_bayesian's SPAM terms now come from the readout channel's measured `fidelity_g` / `fidelity_e` (alpha = 1 - fidelity_e, beta = 1 - fidelity_g) instead of QUAM's `resonator.confusion_matrix`, which only the 07_iq_blobs qualibrate node ever wrote. A setup whose QUAM carries a matrix but whose scqo state has no accepted fidelities is now REFUSED BY NAME until single_shot_readout has run and been accepted - and one calibrated entirely through scqo, which could not run this experiment at all, now can. (c) For code outside scqo: `QMBackend.load(state_path=...)` is required, and `QMBackend.load` no longer exports QUAM_STATE_PATH - anything that read that variable after building a backend must be given the folder instead.

BEHAVIOR UNCHANGED otherwise: the QUA programs are identical (the SPAM pair was a build-time number read from QUAM before and is a build-time number passed in now), no stored file changes shape, and nothing about `scqo run` moves.'''
