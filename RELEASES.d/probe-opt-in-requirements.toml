name = "probe-opt-in-requirements"
repos = { scqo = "c858d96", scqo-qm = "b940b3e", scqo-qblox = "d3429f5" }
kind = "fix"
coupling = "scqo-qm b940b3e and scqo-qblox d3429f5 need scqo >= c858d96: each driver's experiments/__init__.py imports scqo.requirements.declare_probe_opt_in. SILENT with an older scqo: the driver package fails to import, scqo's entry-point discovery skips it, and the catalog holds only the core classes (every run then fails at probe())."
validated = "offline: SCQO tests/test_experiment_outputs.py + test_experiment_docs.py + test_docs_current.py 399, scqo-qm full 853, scqo-qblox full 380; `scqo run qubit_ramsey_flux_crosstalk_pulse --help` and `scqo run qubit_ramsey --help` read in .venv-qm"
notes = "`scqo run <name> --help` (and catalog()'s `requires`) in a driver environment no longer lists what an active reset needs (readout_rotation_rad, readout_threshold, readout_depletion_s, 'only with reset_method=active') for a probe that refuses reset_method='active'; the probes that opted in keep the lines. Each driver now tells scqo, once, that active reset is opt-in per probe (scqo.requirements.declare_probe_opt_in); the opt-in sets and every refusal are unchanged, and so are a driver-free install and the generated documents. Also in this range: CONTRIBUTING.md names the QM lab classes' folder correctly (scqo-qm/scqo_qm/quam_builder/). No upgrade action."
