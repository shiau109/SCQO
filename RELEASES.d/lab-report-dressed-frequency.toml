notes = """BEHAVIOR CHANGE, lab report export only. The Dressed resonant frequency (|0>) cell now comes from the resonator's f_dress0_hz ALONE. It used to fall back to the readout channel's readout_freq_hz whenever that fact was missing, which reports a SETTING as a measurement: catalog.py gives readout_freq_hz role "knob" and design_source ("via", "f_dress0_hz"), and readout_frequency deliberately moves the tone OFF the |0> dip to the single-shot fidelity optimum between f_dress0 and f_dress1 (readout_power re-solves it too). The two agree only right after resonator_spectroscopy, whose update() writes the same number to both homes - which is exactly why the substitution looked harmless. It is not cosmetic: g and kappa are derived FROM f_dress, and f_dress - f_bare is only MHz wide, so a chi-sized error moves g substantially. The fallback also broke the module's own stated first rule, that a missing quantity is missing. UPGRADE REQUIRES: nothing. BEHAVIOR: a chip whose f_dress0_hz was never measured now shows BLANK cells for Dressed resonant frequency (|0>), g/2pi and kappa/2pi instead of numbers built on the readout tone - run resonator_spectroscopy and accept it to fill them. Two follow-ups found alongside are recorded in BACKLOG.md and NOT fixed here: F9 (the report's #100 columns read campaign statistics directly and so bypass the campaign accept, while the #1 columns are accept-gated through physical.json; the fix is to take the value from physical/state and the +/- from the campaign that provenance names) and I13 (rb_fidelity has no catalogued home and no update() writer, so that row exists only through the F9 bypass). OFFLINE-VALIDATED: scqo tests/test_lab_report.py + tests/test_lab_report_isolation.py, 19 passed with ZERO skipped (uv run --extra viewer, SCQO/.venv); the new test is test_the_readout_tone_never_stands_in_for_the_dressed_frequency. HARDWARE: none needed - the viewer is read-only and touches no instrument."""
