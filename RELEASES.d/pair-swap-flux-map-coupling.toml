name = "pair-swap-flux-map-coupling"
repos = { scqo = "94844fb", scqat = "1a86f71" }
kind = "additive"
coupling = "scqo needs scqat >= 5658b36: pair_swap_flux_map's estimate() passes swap_time_ns= to the estimator and reads back coupler_off_v / j_at_off_hz / j_max_hz / n_j_ok / n_branch_warn / n_poly_rows, and the estimator lazy-imports the NEW module scqat.tools.swap_lineshape. Against an older scqat the import fails inside estimate(), i.e. at analysis time on a run that already cost instrument minutes - SILENT until then."
validated = "offline"
notes = "pair_swap_flux_map now FITS: one swap-peak fit per coupler column turns the map into the J(coupler flux) calibration curve, with the resonance line, a J^2 polynomial locating the decouple point, and two new figures (pair_swap_flux_map_coupling.png, pair_swap_flux_map_transfer_fit.png). It also PUBLISHES the two conversion formulas a gate calibration needs - j2_poly_coeffs (theta = 2*pi*sqrt(max(poly,0))*t) and resonance_poly_coeffs (the member flux that puts the pair on resonance at a given coupler bias), with poly_window_v as the validity range and readable j_formula / resonance_formula strings; invert with scqat.tools.swap_lineshape.coupler_flux_for_theta, which returns BOTH branches because |J| has a minimum at the decouple point. BEHAVIOR CHANGE: result.fit gains the scalar coupling keys and the run writes three figures instead of one; no existing key changes meaning and the experiment stays record-only (j_hz is deliberately NOT proposed - the J measured here holds at the pulsed working point, not the standing idle point). Reading the numbers: j_hz needs the duration actually played, so a shaped (flattop_cosine) pulse reports the dimensionless angle only; and columns past a full swap fold under arcsin, so they are flagged in n_branch_warn and kept out of the polynomial rather than unfolded - shorten swap_time_ns to measure them."
