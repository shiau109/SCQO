name = "qubit-resonator-stark"
repos = { scqat = "556fa21", scqo = "429c896", scqo-qm = "6c40fbe", scqo-qblox = "685fd15" }
kind = "additive"
coupling = "scqo needs scqat >= 556fa21: LOUD, not silent — qubit_resonator_stark's estimate() passes twin_coord/twin_label, amp_ref and chi_hz to ac_stark_shift, whose old whitelist refuses twin_coord with a ValueError (and whose old coordinate default, readout_amp_ratio, would not find amp_prefactor). It fails at estimate, i.e. AFTER the instrument time is spent; the dataset is already saved and re-fits once scqat is current. scqo-qm >= 6c40fbe and scqo-qblox >= 685fd15 need scqo >= 429c896: each driver imports QubitResonatorStark from scqo.experiments, so against an older scqo the WHOLE driver experiments package fails to import (every experiment, not just this one) — ship the three in lockstep."
validated = "offline 2026-09-21 — scqat: test_ac_stark_shift_estimator (20, new) + test_no_estimator_layering + test_docs_current = 24 in scqat/.venv; SCQO: test_model_experiments UNFILTERED (a _capabilities/ docstring was touched) + test_capabilities + test_stark_windows (new) + test_one_estimator_per_experiment + test_docs_current + test_contract = 289 in SCQO/.venv; scqo-qm full suite 668 in .venv-qm (incl. the new test_resonator_stark_probe on the live quam_state); scqo-qblox full suite 342 in scqo-qblox/.venv AND 342 in .venv-qblox (qblox-scheduler 1.0.0b6 / qblox-instruments 1.3.0 in both; incl. the new test_resonator_stark_timing and test_probe_compiles[qubit_resonator_stark]). All zero-skip. Plus one end-to-end simulated run (two targets, 16/16 rows fitted each, photon number with a seeded chi_hz). NO hardware run."
notes = '''NEW EXPERIMENT `qubit_resonator_stark` (QM + Qblox, record-only): qubit spectroscopy under a readout-channel Stark tone — the AC-Stark photon map. A tone on the readout channel at readout_freq_hz and `amp_prefactor x readout_amp` (the amplitude capability; the axis is a FACTOR of each target's readout_amp, 0 <= factor < 2) starts one depletion wait before the saturation drive and ends with it; the STANDARD readout follows one more depletion wait later, so every row is read the same way and row 0 is the bare line. The timing is one sentence in `experiments/_stark_tone.py`, resolved once in define_sweep and played by both probes. Fit (scqat `ac_stark_shift`, now bound 1:1): the line per row, then `f = f0 + s a^2` and `fwhm = w0 + b a^2`; `stark_shift_at_readout_hz` = s is the Stark shift of the calibrated readout_amp, and with the resonator's chi_hz (readout_frequency with dip_fit_method=lorentzian|circle) `n_readout` = s / (-2 chi_hz) is its photon number. update() writes nothing.

PREREQUISITE: a governed readout_depletion_s (resonator_spectroscopy proposes it) or readout_depletion_ns= per run — an ungoverned one is REFUSED BY NAME before any instrument time, and on QM that includes QUAM's 16 ns factory default. Targets run one at a time on both backends (N concurrent Stark tones on one feedline would be a different experiment), so a multi-target run takes N times as long.

scqat API CHANGE (no live caller): AcStarkShiftEstimator reads `amp_prefactor` (the `power_coord` knob is gone) and takes chi_hz in Hz in the catalog convention chi = (f_dress0 - f_dress1)/2 (`chi_eff`, MHz = 2 chi, is gone). The only in-tree caller was the retired LCH qualibrate node in scqo-qm's frozen, non-runnable archive.

HARDWARE OWED on both: QM — check in `--preview`'s simulated analog traces that the resonator's Stark tone and the xy drive actually overlap (same-core elements serialize and return a map with no shift and a clean fit); Qblox — the first cluster run of a non-Measure pulse on the readout port-clock.'''
