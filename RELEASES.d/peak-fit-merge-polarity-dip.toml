validated = "offline: scqat 967 passed (full, uv run --extra dev, at 956a30b); SCQO tests/test_model_experiments.py 239 passed unfiltered (uv run --extra viewer) against that tree. Re-analysis of 104 saved 5Q4C runs (read-only, .venv-qm, estimate() on each run's frozen surface): every change inspected, see notes. No new hardware run."
notes = '''BEHAVIOR CHANGE in scqat tools.peak_fit.fit_peaks, the per-trace line fit behind qubit_spectroscopy, qubit_spectroscopy_flux_pulse, qubit_spectroscopy_cryoscope, qubit_parametric_drive_amp, qubit_resonator_stark, broadband_qubit_spectroscopy, readout_pulse_photon and both coupler spectroscopies - three defects, found 2026-09-27. (1) THE MERGE kept the larger-AREA of two overlapping fits, so a broad fit of a weak bump, or one wider than its own window, swallowed the real lines beside it (5Q4C 20260927-191908 at default knobs: a 0.92 x 401 MHz fit took a 0.43 x 9.8 MHz and a 0.30 x 12.9 MHz line). Every fit must now clear min_snr sigma on its own amplitude (a negative one never does), and the merge keeps the TALLER fit by its rise inside its window - a new peak key `height`. (2) AUTO POLARITY compared prominences, so two equal lines could be taken for a dip and return nothing (8 of 60 seeds); it now compares excursion from the baseline. (3) DIP FITS were seeded on a noise point of the shoulder (24 of 40 seeds wrong); a dip is now fitted as a peak of the negated trace and reports a POSITIVE amplitude, as documented - fit_peaks never reports a negative amplitude any more. WHAT MOVES on the saved 5Q4C runs: all 14 qubit_parametric_drive_amp runs (their dip maps were mis-seeded: best_peak_amplitude was NEGATIVE in 9 of 14 and the FWHM up to 45 MHz, now 0.57-1.02 with FWHM 0.5-12 MHz; record-only, nothing was written back); 4 of 19 qubit_spectroscopy runs, where EVERY old answer was wrong - a line reported in pure noise (20260729-005530) or 8-50 MHz off a clear dip (20260820-202333, 20260907-222005, 20260917-195231) - and none of those suggestions was accepted; now two find the dip, the noise run reports no line, and 20260907-222005's dip is shallower than 6 sigma and reports none; 11 of 56 qubit_spectroscopy_cryoscope runs, 4 with a far better step-response fit (rms 0.123 -> 0.00075 on 20260811-221800), one marginal run with its line on the axis edge keeping 11 of 13 rows, no outcome changed. Coupler swap/zz, flux_pulse and broadband runs are unchanged. The coupler estimators no longer need their workarounds for these defects (coupler_ladder.find_lines drops its duplicated amplitude gate); a separate, still-open trap - a broad line's fit window capturing a stronger narrow neighbour - is BACKLOG I27, and is why find_lines keeps fit_window_factor=2.'''
