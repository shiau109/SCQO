name = "readout-frequency-dressed-dips"
repos = { scqat = "785a8e4", scqo = "2f25394" }
kind = "additive"
coupling = "scqo needs scqat >= 785a8e4: readout_frequency now passes dip_fit_method (and baseline_order under 'lorentzian') into ReadoutFreqFidelityEstimator, whose base validates kwargs against an allowlist - an older scqat raises ValueError('Unknown keyword argument(s) [dip_fit_method]') at estimate, loud, after the instrument time is already spent. The failure is unconditional, not opt-in: readout_frequency passes the kwarg on every run, including the dip_fit_method='none' default. scqat carries no floor against scqo."
validated = "offline"
notes = """ADDITIVE, and a CONTRIBUTOR PR pair (Yuhowlin: scqat #30, scqo #31) - the first feature on this line to land through the fork route CONTRIBUTING.md describes, so what the review changed is recorded here as well as what the feature does.

WHAT SHIPS. [1] readout_frequency gains dip_fit_method = 'none' (default) | 'lorentzian' | 'circle'. The sweep already acquires a prepared-|0> and a prepared-|1> trace at every readout detuning in order to find the fidelity optimum; fitting the resonator dip in each of them costs no extra instrument time and yields the DRESSED pair. Under a non-'none' method result.fit gains f_dress0_hz, f_dress1_hz and chi_hz, and update() proposes all three on the attached resonator mode. This is the first writer of f_dress1_hz, which catalog.py has carried since greenfield with the docstring 'No writer yet - a prepared-state readout-frequency sweep measures it; with f_dress0_hz it gives chi'. The sign convention is the catalog's own: chi = (f_dress0_hz - f_dress1_hz) / 2. Default 'none' keeps today's behaviour exactly - no dip fitting, no resonator writeback, no extra figure. [2] scqat's ReadoutFreqFidelityEstimator grows the matching extraction plus a 'response' figure drawing |IQ| for both prepared states with the two dips and the chosen readout frequency marked. [3] resonator_spectroscopy gains dip_branch = 'dress0' (default) | 'bare' - see below.

REVIEW FINDINGS, all fixed before merge; recorded because three of them are the kind that ship green.

(a) THE DIP HAS TWO NAMES AND ONLY ONE IS TRUE PER RUN. The PR as opened wrote the SAME number to f_dress0_hz and f_bare_hz from resonator_spectroscopy, on the reasoning that a sweep taken at punchout power sees the bare mode and the operator would accept whichever applies. The physics is right - _punchout.py's own docstring says the dip walks from f_dress0 to f_bare as the qubit saturates - but the mechanism cannot work: update='apply' is DEFINED as capture-then-accept-everything, and a non-TTY `scqo accept RUN_ID` applies ALL pending, so both landed on every non-interactive path. Anything in the physical store is FACT_MEASURED (experiment.py::fact_sourced), so resonator_spectroscopy_flux::_f_bare_hz then PINS f_bare as a fit constant - which, with f_bare == f_dress0, pins the dispersive pull to exactly ZERO. That function's own docstring calls a 5 MHz error a ~30% move in g and a 20 MHz error the undefined-model case; zero pull is worse than either, and it would have been silent, durable and cross-experiment. RESOLVED by the decision procedure's rule 4 in CLAUDE.md (same shape, meaning and model, different WRITEBACK -> one experiment with a Parameters field selecting the question): dip_branch declares at RUN time which branch the power put the dip on. 'dress0' proposes readout_freq_hz + f_dress0_hz + kappa_tot_hz + readout_depletion_s exactly as before; 'bare' proposes f_bare_hz + kappa_tot_hz and touches NO readout-channel knob, because the only operating quantity such a run could offer is where to park the readout tone and that frequency is one Lamb shift away, resolvable only by a two-branch punchout. fit gains dip_branch as record-only provenance. Because the proposal COUNT never changes, every hardcoded suggestion count in the suite stays put - which is also why the PR's own edits to test_datastore.py, test_cli_run.py and test_model_run.py reverted to baseline, and why test_viewer.py needed no edit at all.

(b) THE FIT'S OWN success FLAG WAS IGNORED. scqat's fit_dip publishes `success: bool - fit trustworthy` precisely so a caller cannot pass an unconverged centre off as a measurement; _extract_dressed_dips read res['detuning'] and never looked. Demonstrated on the PR's own test data: method='circle' returned success=False and the value was published anyway, on its way to becoming a resonator FACT. Fixed - a raise and a success=False are now the same answer, no dip.

(c) A BARE except SUBSTITUTED A GUESS. Any exception fell back to a 3-point parabolic minimum while extract_metadata still reported dip_fit_method='lorentzian', so a failed fit and a real one were indistinguishable. The fallback is deleted; a missing quantity is missing, dip_fit_success says whether BOTH dips converged, and knobs are validated BEFORE any fitting (dip_fit's own instruction) so a knob from the other method raises instead of reading as a fit that failed.

(d) THE circle TEST WAS VACUOUS. Its synthetic data set Q = 0 - a degenerate circle the method cannot fit - and asserted only `is not None`, so it passed on the swallowed failure of (b) rather than on the method. Both tests now run on a real complex notch and their tolerance drops from 50 kHz to 1 kHz, because the deleted fallback landed INSIDE the loose window and a loose tolerance cannot tell a fit from a stand-in.

(e) 187 LINES OF UNRELATED TESTS WERE DELETED. The first commit removed the whole setup-snapshot section of tests/test_datastore.py (v3.9.0's feature) plus the notes= half of a campaign test. tests/test_cli_restore.py imports two of the deleted helpers, so the SCQO suite stopped COLLECTING on all four CI targets - meaning the PR's own new tests had never run once. Restored from main. Also dropped a stray RECORD_ONLY entry naming an experiment that does not exist in this repo, and fixed an order-dependent assertion in the PR's own test (the session fixture is module-scoped, so 'q0_res not in physical_state()' holds only while no earlier test has touched that resonator).

BEHAVIOR. Nothing changes for an existing caller: readout_frequency defaults to dip_fit_method='none' and resonator_spectroscopy to dip_branch='dress0'. dip_fit_success and the dressed keys appear in result.fit / metadata only under a non-'none' method. readout_frequency now always passes twin_coord='full_freq' to its estimator, so its figures gain an absolute-frequency secondary axis on the default path too. Old runs replot from their saved plotdata.nc unchanged.

HARDWARE OWED, and it is the whole feature: no dip_fit_method run and no dip_branch='bare' run has touched an instrument. The dressed pair should be checked against a punchout on the same target - f_dress0_hz from a low-power resonator_spectroscopy and from readout_frequency's |0> dip must agree, and readout_frequency's chi_hz against the punchout's Lamb shift and the flux map's dispersive fit. dip_branch='bare' wants a deliberate punchout-power resonator_spectroscopy compared against resonator_spectroscopy_power_amp's bare branch on the same target.

OFFLINE-VALIDATED: scqat full suite 721 passed (.venv-view; test_readout_fidelity.py 23, up from 20 - the three regression tests for the two silent paths); scqo full suite 1004 passed (.venv-view, driver-free) at a361ea4 and tests/test_model_experiments.py + test_quickwins.py + test_capabilities.py + test_docs_current.py 244 passed on the #31 merge result; SCQO 4-leg CI green on the PR head once scqat #30 had landed."""
