name = "stark-echo-absolute-amp-axis"
repos = { scqat = "f53fc45", scqo = "59cc658", scqo-qm = "db7235b" }
kind = "additive"
coupling = "scqo needs scqat >= f53fc45: estimate() passes twin_coord/twin_label and reads results['amp_2pi']; an older scqat swallows the kwargs and then raises KeyError at estimate (loud, at analysis time, after the instrument time is already spent). scqo-qm needs scqo >= 59cc658 for probe_stark_amp to be consumed - under an older scqo it is an inert attribute, so the driver degrades to today's behavior rather than failing."
validated = "hardware 5Q4C q1+q3 2026-09-08"
notes = """ADDITIVE, qubit_stark_phase_echo only. The experiment now reports the amplitude that produces a FULL TURN (2*pi) of AC-Stark phase, and draws every figure with a second, ABSOLUTE amplitude axis. Both answer the same complaint: the swept stark_amp is a dimensionless factor of the stark operation's baked amplitude, and the one number result.fit published for converting between amplitude and phase was the fitted k*a^2 coefficient - which is the small-drive limit W^2/(4D) and saturates into the dressed-state form once the Rabi rate approaches stark_detuning_hz. On 5Q4C at 50 MHz the global quadratic put the full turn at a = 0.966 where the measured curve, confirmed independently by a qc_unidirectional_trotter compensation scan, put it at a = 0.820 - 18% off in amplitude, and every consumer of the coefficient (notably qc_unidirectional_trotter's compensation_amps) inherited that error. `amp_2pi_factor` is now interpolated between the bracketing MEASURED points and leads result.fit; it is NaN, never extrapolated, when the sweep did not reach a full turn. The absolute frame needs a value the neutral layer cannot read - the reference is a named OPERATION's baked amplitude, not a channel knob (which is why this experiment is still not an `amplitude` capability carrier: the capability is derived from the Parameters MRO and importing its two coordinate constants does not change it) - so the QM probe reports it as probe_stark_amp and attach_acquisition_coords turns it into the `digital_amp` coordinate on dataset.nc, forwarded to the estimator as its twin_coord. Result: a secondary absolute-amplitude axis on the phase and quadrature figures, and `amp_2pi_digital` in result.fit. UPGRADE REQUIRES: nothing. BEHAVIOR: result.fit gains amp_2pi_factor + amp_2pi_digital (the two existing keys are unchanged); dataset.nc gains a `digital_amp` coordinate on QM runs (an extra coordinate, which DatasetContract already permits, so no contract changes); the metadata JSON and plotdata.nc gain amp_2pi/twin fields. Runs taken BEFORE this land keep replotting from their saved plotdata.nc - the absent twin and absent amp_2pi are simply not drawn - but they carry no absolute axis, since the baked amplitude at run time is not recoverable afterwards; an offline script can supply it by assigning a digital_amp coordinate before calling the estimator. Qblox is unaffected: this experiment is QM-only. OFFLINE-VALIDATED: scqat tests/test_qubit_stark_phase_echo_estimator.py 22 passed (+ tests/test_docs_current.py, tests/test_no_estimator_layering.py, 4 passed); scqo tests/test_model_experiments.py -k stark_phase 4 passed, tests/test_capabilities.py 32 passed (pinning that the capability set did NOT change), tests/test_docs_current.py + tests/test_contract.py 18 passed; scqo-qm FULL suite 438 passed (.venv-qm). HARDWARE-VALIDATED on 5Q4C (cd2 / qm_5q) 2026-09-08, q1 and q3, by exactly the invariance the feature exists for: with the stark op baked at 0.4000 the q1 run reported 2*pi at factor 0.8173 = ABSOLUTE 0.3269; after the op was re-baked to 0.3269, the next run reported factor 0.9963 = absolute 0.3257. The factor moved with the reference, the absolute answer did not (0.4%). Same on q3: baked 0.4000 -> absolute 0.4376; re-baked 0.4370 -> absolute 0.4367 (0.2%). The q1 reading also reproduces the 0.820 factor that the 2026-08-27 qc_unidirectional_trotter compensation scan independently confirmed, against the fitted-k prediction of 0.966. And the fitted k moved between each pair by MORE than the baked-amplitude ratio squared, in the direction saturation requires (q1 -6.836 -> -5.169 where a pure quadratic predicts -4.566; q3 -4.617 -> -5.210 where it predicts -5.511) - so the same runs re-confirm why the coefficient must not be the source. One operational note: a full turn outside the swept window is NaN by design, so max_stark_amp must sit above the crossing - q3's first run needed factor 1.094 and was only bracketed because the window ran to 1.5."""
