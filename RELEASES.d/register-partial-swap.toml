validated = "offline 2026-09-22 - scqo-qm full suite 688 passed in .venv-qm, zero skips, including tests/test_register_partial_swap.py (17) on a copy of the local live quam_state: the three entries land and nothing else moves, the macro reloads as ISwapImplementation, and every refusal (name contract, unknown pair, add-vs-update, length, non-finite or clipping amplitude, an edit that landed on disk after loading) leaves the folder byte-identical. SCQO tests/test_docs_current.py 3 passed. Read-only smoke on the live 5Q4C setup: --list, and --dry-run --update of partial_swap_060 on q2_q3 verified against the live folder. The contract it packages (staged save, three-entry diff) wrote the live 5Q4C tree through the session's scratch script while calibrating partial_swap_030 and partial_swap_060 on hardware the same day; the packaged command itself has not yet written a live tree."
notes = '''NEW (scqo-qm): `python -m scqo_qm.backend.register_partial_swap --pair <pair> --name partial_swap_<t> --z-amp <V> --coupler-amp <V>` adds a square partial swap to the active setup's QUAM tree: the control qubit's z pulse and the coupler pulse partial_swap_square_<t>, plus the ISwapImplementation macro partial_swap_<t> that experiments play by name (<t> = target angle x 100, three digits). `--update` retunes the amplitudes of an existing one, `--list` shows every pair's partial swaps (legacy names are shown, not managed), `--dry-run` verifies without writing. The live state.json is replaced only after a staged save proves it differs by exactly those three entries, so a concurrent edit on disk is never overwritten; wiring.json is never rewritten; an amplitude the port would clip is refused before the session-start flux-headroom audit could block every later run. Listed by `scqo state --fields`. It replaces hand-editing quam_config/register_swap_macro.py for new swap angles.

DOCS (SCQO): procedures/pair-partial-swap now runs that command in Step 2 and carries the second calibration (partial_swap_060 on 5Q4C q1_q2 + q2_q3: theta 0.602 / 0.5985) with its lessons: N = round(1.2/theta), the flux-map bias belongs to the pair, and a new trap (a stark window wider than one turn holds two branches that split osc_criteria_agree). procedures/README gains the operator rule that a stark compensation tone stays below one full turn (5Q4C: amplitude 1.0), and chain-trotter-compensation scans to 1.0 instead of 1.25. BACKLOG: F13 removed (landed), new F18 (a stark amplitude-to-phase conversion so the bound can live in code); the round-timing tool stays deferred under F16.'''
