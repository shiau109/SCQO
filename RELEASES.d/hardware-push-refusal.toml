name = "hardware-push-refusal"
repos = { scqo = "4ef0d47", "scqo-qm" = "d29c33d", "scqo-qblox" = "97c292b" }
kind = "breaking"
coupling = "None that can fail silently: the refusal and the parse check both live in scqo core; scqo-qm keeps its own unchanged pull guard as the QUAM-specific second line and scqo-qblox never read state_sync (both driver commits are doc-only). Any recent driver runs against this scqo; an older scqo simply does not refuse."
validated = "offline"
notes = """BREAKING for exactly one artifact, and TEMPORARY by design: a lab config.toml that sets state_sync = "push" for a device on a HARDWARE setup (qblox or qm) is now refused at session start by scqo.labconfig.make_session, keyed once in core on backend_label != "simulated" so both drivers get it without touching either factory. UPGRADE REQUIRES: set state_sync = "pull" in that config.toml, or drop the key ("pull" is the default). Nothing else changes shape - no stored data, no state file, no Parameters field. WHY: a push seeds the vendor config from scqo_state.json at session start and writes NO history rows (seeding is not a change), so it would silently clobber hand edits of the vendor config (QUAM state.json on QM; dut_config.json / hw_config.json LO and attenuation values on Qblox) with no record of having done so. Until now this was refused only on QM, and only by that driver's own guard; the Qblox factory never read cfg.state_sync, so a Qblox setup with push in its config pushed. The built-in simulated backend keeps its FORCED push (an in-memory device has no vendor truth to pull), so practice runs and CI are untouched. ALSO: load_lab_config now validates [lab] state_sync against pull|push and refuses anything else naming the file - a typo like "pul" used to pull silently because RecordingDevice treats anything != "push" as pull. LabConfig.state_sync is typed Literal["pull", "push"]. build_session now surfaces every config parse error (ValueError / FileNotFoundError from load_lab_config) and this refusal as SystemExit text, the way _load_device already did, so scqo run prints the message instead of a traceback. scqo-qm keeps its own pull guard unchanged (the QUAM-specific reason: official qualibrate nodes can still write QUAM); its CLAUDE.md no longer calls flipping to push a per-device ops decision. scqo-qblox gains a State authority note in CLAUDE.md; scripts/check_real_config.py still builds Session(..., state_sync="push") directly on a temp COPY of the real config, deliberately outside make_session. LIFTING IT LATER means deleting the guard in make_session (and its tests) plus, for QM, the driver guard - the parse validation stays. OFFLINE-VALIDATED: scqo 958 passed (.venv-view, driver-free; new tests cover the two hardware labels, the simulated exemption, the vendor-seeded pull control, three bad parse values and the two build_session SystemExit surfacings). Driver suites not re-run for this fragment: both driver commits are doc-only. HARDWARE: none needed - the change can only refuse to open a session; the first hardware session after upgrade on a config that still says push is the confirmation."""
