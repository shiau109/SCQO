validated = "offline 2026-09-25 - scqo-qm 716 passed in .venv-qm, zero skips; and THE DONE-WHEN: the same 716 passed in a scratch venv built from the NEW requirements-qm.lock.txt, where qualibrate, qualibration_libs, qiskit and qutip are not installed at all and only qualibrate-config, quam and qm are present. SCQO: test_docs_current + test_viewer 57 passed for the doc/port changes. The lock was verified to carry ZERO version drift against the one it replaces - every surviving package keeps its pinned version, checked name by name. No hardware is owed: nothing here changes a QUA program, a stored file or a measurement."
notes = '''PHASE 2 of retiring qualibrate (SCQO BACKLOG F21), and the end of it: the QM driver no longer has qualibrate, the GUI, or the vendored nodes. Phase 1 (v3.13.0, fragment `qualibrate-free-driver`) made the driver RUN without them; this deletes them. THE ARCHIVE LIVES IN TAG v3.13.0 - `calibrations/` (with `exclude/` and `offline_graph/`), `calibration_utils/` and `customized/` are readable there and in git history, and nowhere else. Deleting the frozen `customized/` + `calibrations/exclude/` overrides scqo-qm CLAUDE.md rule 3 by the operator's explicit decision.

WHAT WENT. 345 files, ~43k lines: the three directories above plus `sync_official.py`, `calibration_links.toml`, `official_sync.json`, `qm.bat`, `qm.command`, `ANALYSIS_MIGRATION.md`, the root `calibration_db.json` and `qua_config.json`, and `quam_config/instrument_limits.py`. That is all 742 `import qualibrate` / `import qualibration_libs` occurrences in the repo. Dependencies out of `pyproject.toml`: `qualibrate`, `qualibration-libs`, `qiskit`, `qiskit-experiments`, `tqdm`, `lmfit`. KEPT: `qualibrate-config`, which `quam` reads on every serialiser lookup, and `plotly`, which `qm_backend` imports.

UPGRADE REQUIRES. (a) `qm.bat` / `qm.command` are gone - there is no GUI to launch. Activate `.venv-qm` directly (INSTALL.md §1); experiments are `scqo run <name>` and vendor tools are `scqo-qm <command>`. (b) A machine that rebuilds `.venv-qm` from the new lock installs 140 packages instead of 178, and `qutip` is one of the 40 that leave - it was only ever present via `qiskit-experiments`. If the notebooks that open run data in that environment need it, it has to become an explicit dependency rather than arriving by accident. (c) Anything calling the QM builders directly: `pair_swap_chevron`/`pair_swap_flux_map`'s `amp_mode` is gone and the sweep is always absolute volts; `qubit_spectroscopy`'s `operation_amp` is gone; `resonator_spectroscopy_power_amp.acquire`'s `num_detuning_points` is now `num_amp_points`.

THE LOCK WAS REGENERATED WITH ZERO VERSION DRIFT, deliberately. A plain `uv pip compile` moves 73 packages - `qm-qua` 1.2.6 -> 1.4.1, `quam` 0.5.0 -> 0.6.0, `xarray` DOWNGRADING to 2024.11.0 - and this file is the pin authority for exactly that stack. The new dependency set was therefore resolved CONSTRAINED to the existing lock, so every surviving package keeps the version it had. `netcdf4` + `cftime` are added rather than drift: a current requirement of `scqo` the old lock predated.

BEHAVIOR UNCHANGED for everything that survives: no QUA program changes (the `amplitude_scale=1.0` the removed `operation_amp` always carried is now a literal, so the generated script is byte-identical), no stored file changes shape, and `scqo run` is untouched. Three guards in the pair-swap probes were removed with `amp_mode` rather than kept, because none of them could fire once the sweep is always volts - the shared baked reference makes a flux-element collision impossible, `qua_amps` peaks at exactly 1.0 by construction, and the chevron\'s >16 ns check duplicated a refusal `check_flux_pulse_relative` already makes earlier and with the reachable excursion named. `scqo_backend.py`\'s `state_sync` guard went the same way: its reason was the nodes. scqo\'s `make_session` keeps the one remaining push refusal, whose reason (a push clobbers hand edits of the vendor config, with no history rows) is still live - BACKLOG F7.'''
