name = "spectroscopy-backend-parity"
repos = { scqo = "cb17bb1", "scqo-qm" = "d3077af", "scqo-qblox" = "7a76a13" }
kind = "breaking"
coupling = "All three repos move together: the driver probes read the two new OverlapWindows leads (drive_lead_ns / readout_lead_ns) and the new readout_overlap parameter, so a driver at this commit against an older scqo dies on an AttributeError naming the field, and an older driver against this scqo still compiles a latched-CW schedule. Both failures are LOUD except the second, which is the one to watch: pin the combo, do not mix."
validated = "offline"
notes = """BEHAVIOR CHANGE, and it changes measured numbers on Qblox. qubit_spectroscopy was two different experiments behind one name: QM played a finite saturation pulse and measured after it, Qblox latched a VoltageOffset across the whole sweep so its drive was still on during every Measure. The Qblox peak therefore carried the readout photons' AC-Stark shift and QM's did not, and both wrote the result into the same drive_freq_hz / f_01_hz. Any Qblox qubit_spectroscopy or broadband_qubit_spectroscopy result taken before this cut is a driven-line measurement, not a bare one; re-run before trusting a stored f_01_hz to better than the shift. UPGRADE REQUIRES, in order: (1) the experiment name qubit_spectroscopy_overlap NO LONGER EXISTS - it is qubit_spectroscopy with readout_overlap=true. Stored run records still read fine (the datastore compares the name as a string and never resolves it to a class), and a campaign plan naming it fails preflight loudly rather than raising; but any shell, script or plan that RUNS it must be edited. Known outside these repos: scqo-agent carries scripts/scqo_qubit_spectroscopy_overlap.py and a knowledge doc naming it. (2) drive_len_ns changed from optional to required-with-default on qubit_spectroscopy and broadband_qubit_spectroscopy (20000 ns, matching what the QM configs already carried on the saturation op), so nothing has to be typed, but the QM per-qubit saturation length in state.json NO LONGER governs an scqo run - one scalar now covers every target of a multiplexed run. The qualibrate node still reads it. (3) The overlap TIMING DEFINITION changed with the merge: the old experiment co-started the two tones, the merged mode ends the drive WITH the tone. Old overlap runs cannot be compared with new ones side by side. WHAT SHIPS: the sequence is now one sentence on both backends - the drive ENDS at an anchor and starts drive_len_ns earlier, with readout_overlap picking the readout tone's START (default, the bare line) or its END (the line under measurement conditions, AC-Stark shifted, and the writeback carries the shift). Nothing bounds drive_len_ns against the readout tone any more - a 20 us drive against a 2 us tone simply starts first - so _overlap.py drops that refusal and hands out two non-negative start leads instead, exactly one of them non-zero, spent by whichever element starts second (a wait() on QM, a rel_time on Qblox, which cannot go negative inside a subschedule). On Qblox the drive became a SquarePulse; no waveform memory is lost, because the vendor's compile_long_pulses_to_awg_offsets pass rewrites any square pulse of 100 ns or more into the same VoltageOffset pair plus a 4 ns tail. ALSO: qubit_spectroscopy now opts into reset_method='active' on BOTH backends - with a finite drive its Reset is a genuine state reset (the reason Qblox denied it), and it sweeps only the drive frequency so the readout condition the discriminator was solved at never moves. NOT hardware-validated; treat the first active-reset spectroscopy run as a bring-up. THE RULE THIS CAME OUT OF is now written down in SCQO/CLAUDE.md (Backend parity): given one Parameters object both probes must realize the same sequence - same pulse order, same pulses present, same tones on during acquisition - with only vendor idiom allowed to differ, and a field description saying some backend 'ignores' a parameter named as its counter-example (drive_len_ns carried exactly that sentence). It is scoped to sequence semantics so it does not contradict the deliberately asymmetric capability opt-in sets, which stay refuse-by-name. Each driver pins its half structurally: tests/test_sequential_timing.py walks the compiled Qblox tree at all three emission shapes, tests/test_sequential_probe.py asserts the generated QUA. HARDWARE LEDGER: NEWLY OWED - the whole feature is offline-only. Owed on 5Q4C q1: qubit_spectroscopy with readout_overlap=false compared against the previous Qblox CW result (the peak should move back by the readout-photon Stark shift, which is the direct evidence the fix took), the same run with readout_overlap=true to confirm it reproduces the old overlap behaviour, and the QM overlap branch checked on the OPX simulator's analog traces - xy and resonator sharing a FEM core serialize silently and hand back the sequential experiment with a clean-looking fit. Active reset on qubit_spectroscopy is owed on both backends."""
