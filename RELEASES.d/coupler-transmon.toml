name = "coupler-transmon"
repos = { scqat = "cea9ea8", scqo = "e73de39", scqo-qm = "f0adf0c", scqo-qblox = "a7a57a2" }
kind = "additive"
coupling = "the coupler power Rabi needs scqat >= cea9ea8 (SILENT: before it power_rabi took the GLOBAL argmax, so a window holding several Rabi periods - a coupler's coarse scan - returned 3pi as SUCCESSFUL); scqo-qm f0adf0c and scqo-qblox a7a57a2 read the new fields by name and degrade to today's behaviour without them, so no driver floor - release the four together as usual"
validated = "offline, on main after the merge (2026-09-28): scqat power_rabi tests 18 passed; SCQO full suite 1254 passed 0 skipped; scqo-qm 810 passed in .venv-qm (adopt-channel on a copy of the live quam_state); scqo-qblox 379 passed in .venv-qblox and 379 in uv run; on 5Q4C `adopt-channel --list` and the step-1 `--dry-run` read the live config, nothing written. Hardware 5Q4C 2026-09-28: xy2.q1_q2_c adopted (plan section 8 step 1); step-2 regression - q2 power Rabi within 1 %, pair_coupler_spectroscopy_zz re-finds q1_q2_c at 7.0590 GHz on the two-upconverter port (tone LO 7.1 GHz), no setup drift in any run; q1's pi_amp moved -10 % with its port's band switch (band-dependent output gain at 5.14 GHz) and was recalibrated (pi_amp 0.1918, pi_amp_x90 0.09255). The coupler power Rabi of q1_q2_c through xy2 read through q1 PASSES plan steps 3-6: coarse run 20260928-193455-510 a clean coherent Rabi with the first extremum taken, fine run -193927-094 -> xy2.q1_q2_c.pi_amp 0.0702 accepted, closure run -194531-866 factor 0.995 (fit) / 1.008 (grid). q2_q3_c (step 7) owed"
notes = "ADDITIVE. qubit_power_rabi takes a tunable COUPLER as its target through two new capabilities (docs/coupler-transmon-plan.md): drive_line - the pulse plays through a named line's channel, typically a BORROWED one (xy2.q1_q2_c), whose pi_amp is read and calibrated on it - and mapped_readout - readout_member reads the coupler through a pair member (a selective pi plus the member's x180 copy its state onto the member, then the member's discriminated readout); one target per run, thermal reset. QM MW-FEM only: the operator first runs `scqo-qm adopt-channel <line>.<target> --lo-hz <Hz>` (`--list` / `--dry-run` to look first), which adds the channel on the line's port through its SECOND upconverter - the port moves to the upconverters-dict form and the port pair's band may change, so re-check that pair's qubits afterwards (5Q4C: moving con1/6/2 from band 1 to band 2 raised q1's drive at 5.14 GHz by ~12 % in amplitude, so its pi_amp needs recalibrating; q2 at 4.84 GHz was unaffected). Qblox and Octave refuse both fields by name. BEHAVIOR CHANGE: a state.json that has ADOPTED a channel carries borrowed_channels, which an older scqo-qm cannot load (an unadopted tree saves exactly as before); adopting is an operator action, never an upgrade step. power_rabi (scqat) takes the first extremum within the first fitted period - unchanged for a window holding one extremum. pair_coupler_spectroscopy_zz refuses a pi member the tone's band switch would park (was a silent no_line, BACKLOG I29); broadband_qubit_spectroscopy refuses a port pair carrying a second upconverter."
