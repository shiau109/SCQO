name = "coupler-transmon"
repos = { scqat = "cea9ea8", scqo = "e73de39", scqo-qm = "f0adf0c", scqo-qblox = "a7a57a2" }
kind = "additive"
coupling = "the coupler power Rabi needs scqat >= cea9ea8 (SILENT: before it power_rabi took the GLOBAL argmax, so a window holding several Rabi periods - a coupler's coarse scan - returned 3pi as SUCCESSFUL); scqo-qm f0adf0c and scqo-qblox a7a57a2 read the new fields by name and degrade to today's behaviour without them, so no driver floor - release the four together as usual"
validated = "offline, on main after the merge (2026-09-28): scqat power_rabi tests 18 passed; SCQO full suite 1254 passed 0 skipped; scqo-qm 810 passed in .venv-qm (adopt-channel on a copy of the live quam_state); scqo-qblox 379 passed in .venv-qblox and 379 in uv run; on 5Q4C `adopt-channel --list` and the step-1 `--dry-run` read the live config, nothing written. 5Q4C hardware owed: docs/coupler-transmon-plan.md section 8"
notes = "ADDITIVE. qubit_power_rabi takes a tunable COUPLER as its target through two new capabilities (docs/coupler-transmon-plan.md): drive_line - the pulse plays through a named line's channel, typically a BORROWED one (xy2.q1_q2_c), whose pi_amp is read and calibrated on it - and mapped_readout - readout_member reads the coupler through a pair member (a selective pi plus the member's x180 copy its state onto the member, then the member's discriminated readout); one target per run, thermal reset. QM MW-FEM only: the operator first runs `scqo-qm adopt-channel <line>.<target> --lo-hz <Hz>` (`--list` / `--dry-run` to look first), which adds the channel on the line's port through its SECOND upconverter - the port moves to the upconverters-dict form and the port pair's band may change, so re-check that pair's qubits afterwards. Qblox and Octave refuse both fields by name. BEHAVIOR CHANGE: a state.json that has ADOPTED a channel carries borrowed_channels, which an older scqo-qm cannot load (an unadopted tree saves exactly as before); adopting is an operator action, never an upgrade step. power_rabi (scqat) takes the first extremum within the first fitted period - unchanged for a window holding one extremum. pair_coupler_spectroscopy_zz refuses a pi member the tone's band switch would park (was a silent no_line, BACKLOG I29); broadband_qubit_spectroscopy refuses a port pair carrying a second upconverter."
