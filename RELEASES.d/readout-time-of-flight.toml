coupling = "scqo needs scqat >= 16042d6: a LOUD floor, and late. readout_time_of_flight's estimate() imports scqat.estimators.readout_time_of_flight, which does not exist before that commit - so the ImportError lands at ANALYSIS, after the instrument time is spent. The dataset is already saved and re-fits once scqat is current. The drivers need scqo >= c0a17d4 the usual way: both probes subclass scqo.experiments.ReadoutTimeOfFlight and import its TIME_AXIS, so against an older scqo the whole driver experiments package fails to import - every experiment, not just this one. Take all four together, as a combo checkout does."
validated = "HARDWARE 5Q4C q1 (cd2/qm_5q) 2026-09-26 on the QM side, which is F22's done-when: `scqo run readout_time_of_flight --target q1 --set readout_amp_factor=2.8` reports 392 ns against the stored 384 - 8 ns, two grid steps - reproducibly across independent runs (arrival 364.7 / 365.1 ns), plateau SNR 22-27, a 4 ns edge, no refusal flags, and the hint renders `q1: q.resonator.time_of_flight = 392 ns`. The stored 384 is the retired node's number on this wiring, so the two agree. NOTHING on the instrument was mutated: all five qubits unchanged afterwards and setup_snapshot.drift empty. QBLOX IS STILL OWED - its schedule compiles but no cluster run exists. Offline, every suite in the environment ENVIRONMENTS.md names for its repo: scqat 853 passed (up from 839), scqo 1086 passed with ZERO skipped (up from 1078, uv run --extra viewer), scqo-qm 726 passed with ZERO skipped in .venv-qm (up from 716, and the raw-trace program ASSEMBLES against the live quam_state), scqo-qblox 350 passed in BOTH environments (up from 342)."
notes = '''NEW EXPERIMENT readout_time_of_flight (additive, QM + Qblox, record-only, OFFLINE-ONLY): the readout round-trip delay, measured from the digitizer's own raw trace. Emit a readout pulse, open the acquisition window at a declared early origin, record the RAW ADC samples averaged over shots; the trace reads noise, then a step, then a plateau, and the step edge is the delay. BACKLOG F22, built as decision (1) of the qualibrate retirement (F21).

WHY IT EXISTS. Nothing measured this after v3.14.0 removed the qualibrate nodes 01a/01b, and the Qblox side never had a path at all. Until now a re-cabling, a fridge cycle that moved a line or an instrument swap left the delay as a hand edit from a known-good value - and a wrong one shifts the ADC window and costs readout fidelity with NOTHING saying so, because a mis-aligned window still returns a perfectly well-formed number. It is ONE experiment for both backends, as the operator asked, not a QM-only stopgap.

THE DESIGN POINT, worth reading because the obvious approach fails in a way that hides itself: the window does NOT open at the channel's current setting. If that setting is already correct the pulse is present at sample 0, there is no pre-arrival baseline, and the threshold has nothing to sit between - the measurement would work only while it was not needed. So the window opens at a DECLARED EARLY ORIGIN (`window_start_ns`, 0 = as early as the instrument allows; QM's floor is 28 ns, Qblox has none) and the answer is `window_start_ns + arrival`, rounded onto the 4 ns grid both vendor fields take. The retired node did the same thing - it pinned time_of_flight to 28 ns for the run and added the two back together at writeback - but here the frame TRAVELS WITH THE DATASET, so a re-fit cannot silently use a different origin than the one the data was taken in, which matters because this experiment's whole output is a request to change that very setting. A non-zero window_start_ns below the floor is REFUSED BY NAME in define_sweep, before any instrument time: a stated origin is usually someone reproducing an old run.

IT PROPOSES NOTHING, and that is a decision rather than an omission. The delay is VendorOnly on BOTH backends and both fieldmaps already said so in as many words - QM's `time_of_flight` (ns) and Qblox's `readout_acq_delay` (s) each carry "The TOF measurement's product is written HERE ... offline - never a neutral field". A neutral knob would hand the calibration loop a field it cannot push. So it prints the answer instead (`scqo/experiments/_tof_hint.py`), in the cryoscope's shape but with one difference: a cryoscope asks the backend for a whole command string because applying taps has its own CLI, while a delay is one number in one field. The backend therefore only says WHICH field (`readout_delay_context`, the `power_context` shape - one duck-typed hook, one dict, vendor keys inside) and the path, the unit and the edit instruction are read from the inventory `scqo state --fields` already renders (`Backend.vendor_only`). The neutral layer learns neither vendor's spelling, and the value is converted into the unit that field declares: the SAME measurement prints as `q.resonator.time_of_flight = 236 ns` on QM and `element.measure.acq_delay = 2.36e-07 s` on Qblox. A backend with no hook, an unknown unit and a RAISING hook each degrade to a line - a hint may never take a measurement down with it.

WHAT IT REPORTS. `time_of_flight_ns` is the absolute value to write; `arrival_ns` keeps the unrounded measurement beside it, because a real delay need not be a multiple of 4 and that residual is the grid's limit, not the fit's. Plus `window_start_ns` (the frame), `old_delay_ns` / `delta_ns` (what the channel carried and the change), the quality pair `rise_time_ns` / `plateau_snr`, and three refusals that each replace a number that would otherwise look confident: `arrival_unresolved` (no crossing - typically the per-shot phase reset failed and the averaged step washed out), `arrival_at_edge` (a crossing in the first or last tenth, so the window is mis-placed by more than the trace can see and the value is a bound), `adc_saturated` (clipping flattens the very edge being measured, biasing it early). An UNCHECKED saturation flag is NaN, never 0.0, which would read as "checked, clean" - Qblox declares no full scale on purpose, because the QRM's input range depends on the module and its input attenuation.

ZERO CAPABILITIES, written down rather than left unpinned: it prepares no qubit state (no qubit_reset), discriminates nothing (no state_readout - the variables are raw ADC samples), and its one axis is digitizer TIME, which is not a swept knob. It joins broadband_resonator_spectroscopy in the `none` bucket, which `test_cli_listing` had pinned at exactly one experiment.

DRIVER NOTES. QM borrows TWO vendor fields for the run and restores both in a `finally`: `time_of_flight` because it is the window origin, and the readout operation's LENGTH because an ADC trace lasts exactly as long as the measurement that produced it - the live 5Q4C tree stores an 800 ns readout while this experiment's axis defaults to 1000 samples, so leaving the op alone would declare an axis the returned trace does not match. A missed restore is worse than the bug being fixed, so the test covers the raising path. `reduce_raw` converts the 12-bit counts to volts as `-adc / 2**12` (the input is inverting). Qblox uses `Trace`, the one acquisition protocol that driver had never used, and deliberately NOT `Measure`, which would place an integrated acquisition at the element's own acq_delay - the number under test. Both run ONE TARGET AT A TIME: two resonators on one feedline share an input port, so a multiplexed raw capture records both pulses superposed on one trace.

THREE DEFECTS THE HARDWARE FOUND, all fixed and regression-tested before this fragment was written, and none of them reachable offline. (1) The borrow never reached the instrument: generate_config() runs AFTER probe() returns, so writing the QUAM tree in probe() and restoring in a finally released it before it was ever read - the program would have opened its window at the very setting under test, and the QUA assembles cleanly either way. Caught by `--preview` against the real tree BEFORE any qubit was touched. Fixed by amending the GENERATED CONFIG instead (patch_preview_config plus a probe-supplied acquire callable, the parametric-drive pattern), which also removes the risk class: no vendor state is written, so none can be left wrong by a crash. (2) A raw trace needs its own readout amplitude - at the stored 0.313 the 5Q4C trace was flat noise end to end (SNR 0.37) and the fit correctly refused, because integration over an 800 ns readout buys about 28x SNR that a per-sample trace does not get. That is why the retired node hard-set -12 dBm, and why `readout_amp_factor` exists; 2.8 reproduces the node's amplitude there. (3) rise_time_ns was measured from the wrong end, reporting 339 ns for an edge whose true 10-90 % is 4 ns, because the 10 % level sits inside the noise band and the search started at the trace head; it is now anchored outward from the midpoint. The default num_averages is 4000 rather than the mixin's 100 for the same SNR reason - at 100 the plateau SNR was 1.2 and the edge finder tripped on noise, and the run costs seconds either way.

KNOWN, and it is the first thing to check on the first Qblox run: the SHAPE the cluster returns for a `Trace` acquisition has never been seen here. The schedule compiles - a real gate, since the time grid and the acquisition declaration are enforced inside the compiler - but the canonicalization assumes one complex array per `acq_channel` over the trace samples, which is what every other protocol returns over its swept axis. If that is wrong, `_to_canonical` is where it lands.'''
