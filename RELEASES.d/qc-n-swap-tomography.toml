name = "qc-n-swap-tomography"
repos = { scqat = "d67fa3a", scqo = "8dfb76a", scqo-qm = "73cfc4c" }
kind = "additive"
coupling = "scqo 8dfb76a needs scqat >= d67fa3a (estimate() lazy-imports scqat.estimators.qc_n_swap_tomography and reads theta_consistency_sigma / frame_step_rad); scqo-qm 73cfc4c needs scqo >= 8dfb76a (BASIS_LABELS / PREPARED_STATES, the QcNSwapTomography class, the stark_detuned default)"
validated = "hardware 5Q4C 2026-10-01 (q2_q3 + q1_q2 partial_swap_040, gap 260: theta' and the compensating amplitude within 0.01 of a same-session qc_n_stark_amp; runs 20261001-201942-810 / -202059-791 propose theta_rad); offline scqat 29 targeted, SCQO targeted + contract/capabilities/docs, scqo-qm full 832"
notes = "New experiment qc_n_swap_tomography (QM only): repeated partial swaps (the qc_n_stark_amp round) read by two-qubit state tomography, with an in-run 4x4 readout calibration. From one N sweep it fits the swap as a channel: the exchange angle per step (proposed as <pair>.<op>.theta_rad), the per-step relative phase and, with two or more stark amplitudes, the compensating amplitude, the incoherent error per step, and the measurement frames' turn per round (frame_step, also predicted from the drive frequencies and round_duration_ns). Spec + hardware findings: SCQO docs/qc-n-swap-tomography-plan.md (section 12). scqat gains tools/two_qubit_tomography.py and tools/swap_channel.py. scqo-qm: the round lives in experiments/_pair_swap_round.py, shared with qc_n_stark_amp (its QUA unchanged); the tomography re-references both members' frames every shot and switches no frequency. UPGRADE REQUIRES (per setup that runs it): python quam_config/register_stark_detuned.py <setup backend_config> - adds stark_detuned (the stark envelope with its 50 MHz detuning in the waveform) beside every Gaussian stark; without it the probe refuses by name. 5Q4C cd2/qm_5q already has it."
