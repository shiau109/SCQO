name = "qc-n-swap-tomography"
repos = { scqat = "40cdec1", scqo = "905652e", scqo-qm = "c596436" }
kind = "additive"
coupling = "scqo 905652e needs scqat >= 40cdec1 (estimate() lazy-imports scqat.estimators.qc_n_swap_tomography, which reads theta_consistency_sigma); scqo-qm c596436 needs scqo >= 905652e (BASIS_LABELS / PREPARED_STATES and the QcNSwapTomography class)"
validated = "offline (scqat 25 targeted, SCQO targeted + contract/capabilities/docs, scqo-qm full suite 827); QUA preview built on the live 5Q4C config, no hardware run yet (BACKLOG: Hardware validation owed)"
notes = "New experiment qc_n_swap_tomography (QM only): repeated partial swaps (the qc_n_stark_amp round) read by two-qubit state tomography, with an in-run 4x4 readout calibration. From one N sweep it fits the swap as a channel: the exchange angle per step (proposed as <pair>.<op>.theta_rad), the per-step relative phase and, with two or more stark amplitudes, the compensating amplitude, and the incoherent error per step (each member's T1 loss, dephasing, prep error, |11> growth; vs T1/T2* with round_duration_ns). Spec: SCQO docs/qc-n-swap-tomography-plan.md. scqat gains tools/two_qubit_tomography.py and tools/swap_channel.py. scqo-qm: the round moved into experiments/_pair_swap_round.py, shared with qc_n_stark_amp, whose generated QUA is unchanged; qc_n_stark_amp's operation_gap_ns description now says swap -> gap -> stark (what it always played). No upgrade action."
