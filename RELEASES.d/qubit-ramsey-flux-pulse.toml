name = "qubit-ramsey-flux-pulse"
repos = { scqat = "3f0e3e7", scqo = "8aab2c3", scqo-qm = "f454c7d", scqo-qblox = "edc311e" }
kind = "additive"
coupling = "scqo needs scqat >= f352fae: a LOUD floor, and late - qubit_ramsey_flux_pulse's estimate() imports scqat.estimators.qubit_ramsey_flux_pulse (and scqat.tools.fringe_frequency behind it), which do not exist before 37a41ee, so the ImportError lands at ANALYSIS after the instrument time is spent; the dataset is saved and re-fits once scqat is current. f352fae itself is the F25 order canonicalization on that estimator (artifacts ascending, pinned by order_free); 3f0e3e7 after it only regenerates scqat's CLAUDE.md tool-consumers table (CI's test_docs_current), so the floor stays f352fae. The drivers need scqo >= 7435f78 the usual way: both probes subclass scqo.experiments.QubitRamseyFluxPulse, so against an older scqo the whole driver experiments package fails to import. Builds on sweep-order-traversal (start_flux_v/end_flux_v); take all four together, as a combo checkout does."
validated = "HARDWARE 5Q4C q1 (cd2/qm_5q) 2026-09-26 on the QM side, runs tagged f23-compare: from a deliberate +8 mV DC offset, run 1 stopped 0.39 mV short (pulse/DC ratio g = 0.956) and run 2 landed 0.016 mV from a same-hour manual DC reference; the resonator flux map and the pulse arch were compared from the same start (about 2 mV and 0.26 mV off). A scratch prototype of the same QUA builder measured g = 0.958 / 0.960 (two methods) with no constant offset and a phase linear in tau over 4 us. QBLOX IS OFFLINE ONLY: the schedule compiles and is pinned structurally, no cluster run. Offline suites in the environments ENVIRONMENTS.md names: scqat 878 passed (before the order commit; its targeted files after it); scqo 1164 passed plus the 3 pinned catalog lists fixed and re-run (uv run --extra viewer); scqo-qm 746 passed in .venv-qm; scqo-qblox 370 passed in BOTH scqo-qblox/.venv and .venv-qblox."
notes = '''NEW EXPERIMENT qubit_ramsey_flux_pulse (additive, QM + Qblox; QM hardware-validated, Qblox offline-only): park a flux-tunable qubit at its flux apex, or at a chosen f01, to a few hundredths of a millivolt. The pi/2 pulses and the readout stay at the idle point; a square z pulse detunes the qubit only during the idle, so each flux point is one Ramsey fringe whose frequency gives f01 there to a few kHz, and a local quadratic gives the apex (park_frequency_hz None) or the flux for park_frequency_hz (flux_side picks between two roots; never extrapolated). BACKLOG F23; procedure procedures/qubit-frequency-park.

WHAT IT WRITES (one target on its own line, SUCCESSFUL): idle_flux re-referenced to ABSOLUTE (old_idle_flux + the fitted excursion), drive_freq_hz with its f_01_hz twin, and flux_offset + f_q_max_hz when the window held the apex. Record-only with several targets (every line moves at once and neighbours pick up ZZ/2) or with a foreign flux_component. The fit reports the swept frame (flux_offset_from_idle, park_excursion_v) beside the absolute values, plus curvature_hz_per_v2, df_dflux_hz_per_v and the flags apex_not_bracketed / park_out_of_window / fold_suspected / multi_target_context.

FOLDING IS DESIGNED OUT, not documented around. The fringe sits at |D + (f_q - f_drive)|; define_sweep predicts the swing over the window from the arch facts (f_q_max_hz, flux_offset, flux_per_phi0, ec_hz) and picks the SIGN of the virtual detuning so the swing pushes the fringe away from zero - at the apex the qubit can only drop, so no swing folds. A window that would still fold (folding_risk) or that the idle grid cannot sample (undersampled) is refused by name before any instrument time, with the detuning or grid that works. Without arch facts it takes the apex default and says so (ramp_sign_from). The signed ramp rides dataset.nc as an acquisition note, so a re-fit reads what was played.

A PULSE IS NOT A DC STEP, and the numbers say by how much: on 5Q4C q1 a z pulse moves the qubit g ~ 0.96 of the same DC step, with no constant offset - so a park from far away lands within ~4 % of the move and a re-run converges. The DC apex itself drifts (~0.2 mV/h at times) and a wide DC sweep (the resonator flux map over 0-0.49 V) most likely moved q1's apex by -0.31 mV, so the procedure never runs the wide map after the fine park and judges only against a same-hour reference.

ALSO: qubit_spectroscopy_flux_pulse and resonator_spectroscopy_flux drop their "AUTHORITY for idle_flux" / "BRING-UP seed" wording - the three are complementary ways to place a qubit on its arch and all three propose idle_flux (user decision). No behaviour change there. New scqat tool fringe_frequency (periodogram peak, then an (f, decay) least squares with amplitude and phase solved linearly: no phase seed, kept only within half a natural bin of the peak) - the intended fix path for the ramsey estimator's large-detuning misfit (BACKLOG I24). QM opts in to active reset like qubit_ramsey and takes another qubit's z as flux_component (a coupler is refused by name); Qblox refuses both until it has run on a cluster.'''
