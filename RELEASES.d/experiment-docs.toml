name = "experiment-docs"
repos = { scqo = "651383c", scqo-qm = "d7de49b", scqo-qblox = "43f58a8" }
kind = "additive"
coupling = "scqo-qm d7de49b and scqo-qblox 43f58a8 need scqo >= 3d53be5: their experiment modules import scqo.requirements.Requirement and extend the core classes' `requires` (a core before 14240f9 fails at import, loudly; one between 14240f9 and 3d53be5 imports, and `scqo run <name> --help` then shows an incomplete prerequisite list for the experiments declared later). No scqat floor from this feature."
validated = "offline: SCQO full 1750 passed (uv run --extra viewer pytest -q, at 3d53be5; the commits after it add documents only); scqo-qm full 852 and scqo-qblox full 379 against that core BEFORE the fast-forward (the worktree packages on PYTHONPATH, in .venv-qm and in scqo-qblox's uv env); after landing, on SCQO main: tests/test_experiment_docs.py + test_experiment_outputs.py + test_experiment_projects.py + test_sequence_diagram.py, 432 passed. The driver suites were NOT re-run from main in the shared venvs - owed at the cut. No hardware: every document says `validated: offline`, and every expected-result figure is a simulated run."
notes = "Every registered experiment (52) now has one document inside the package, scqo/experiments/_docs/<name>/README.md: purpose, what must be right first, the pulse sequence (sequence.svg), outputs, the expected result (expected.png), traps. Index: _docs/README.md; who writes and who needs each field: _docs/DEPENDENCIES.md. What an experiment needs and what it leaves behind are DECLARED on the class - `requires`, `writes`, `extracts` (scqo.requirements) - and shown by `scqo run <name> --help` and catalog(); a driver adds `backend_notes` and the fields only it consumes, shown in that driver's environment. Experiment.sequence_diagram(params) is the neutral declaration of the sequence both probes must play. Experiment.project separates shared experiments from a research project's own (today MpembaEP_trotter: qc_unidirectional_trotter, qc_trotter_compensation). BEHAVIOR CHANGE: `scqo run` with no name and `scqo run --capability` list the shared experiments only; `scqo run --project MpembaEP_trotter` lists the project's; running an experiment by name is unchanged. No upgrade action. For contributors: a new experiment ships its declarations and its document - tests/test_experiment_docs.py and tests/test_experiment_outputs.py fail otherwise; figures and generated blocks come from `python scripts/update_docs.py [--figures <name>]`. Left out and open: every Theory section is empty and nothing is hardware-validated (docs/experiment-docs-plan.md section 16 lists what was deferred); defects found while writing the documents are recorded, not fixed, as SCQO BACKLOG I39-I42."
